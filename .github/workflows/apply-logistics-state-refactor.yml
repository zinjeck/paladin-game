name: Apply Logistics State Refactor

on:
  push:
    branches:
      - agent/extract-city-logistics

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[logistics-state-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/extract-city-logistics
          fetch-depth: 0
      - name: Apply guarded transform
        run: python3 ci/refactor_city_logistics_state.py
      - name: Commit transformed source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/world/simulation/WorldData.gd \
                  scripts/world/simulation/WorldPoliticalState.gd \
                  scripts/city/simulation/CitySettlementStateIsolationTest.gd \
                  ci/audit_gdscript.py
          git diff --cached --check
          git commit -m "Extract city logistics state [logistics-state-applied]"
          git push origin HEAD:agent/extract-city-logistics
