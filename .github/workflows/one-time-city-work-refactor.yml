name: One-time City Work Refactor

on:
  push:
    branches:
      - agent/extract-city-work-state

permissions:
  contents: write

jobs:
  apply-refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply exact storage extraction
        run: python3 ci/one_time_extract_city_work_state.py

      - name: Commit generated refactor
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/world/simulation/WorldData.gd scripts/world/simulation/WorldPoliticalState.gd
          git commit -m "Route WorldData work fields to settlement state"
          git push origin "HEAD:${GITHUB_REF_NAME}"
