name: Apply balanced food pass

on:
  push:
    branches:
      - paladin/balanced-food-household-cycle
    paths:
      - .github/workflows/apply-balanced-food-pass.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out food branch
        uses: actions/checkout@v4
        with:
          ref: paladin/balanced-food-household-cycle
          fetch-depth: 0

      - name: Apply balanced food patch
        run: |
          cat .github/food-pass-part-* | base64 -d > /tmp/food-pass.patch
          git apply --check /tmp/food-pass.patch
          git apply /tmp/food-pass.patch
          rm -f .github/food-pass-part-* .github/workflows/apply-balanced-food-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Balance hunger, household pantries, and food production"
          git push origin HEAD:paladin/balanced-food-household-cycle
