name: Pass 14 WorldData Audit
on:
  push:
    branches: [agent/pass14-worlddata-final-boundary]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report WorldData surface
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('scripts/world/simulation/WorldData.gd')
          t=p.read_text(encoding='utf-8')
          print('=== TOP LEVEL CONST/VAR ===')
          for i,line in enumerate(t.splitlines(),1):
              if re.match(r'^(?:static\s+)?(?:const|var)\s+', line):
                  print(f'{i}: {line}')
          print('=== FUNCTIONS ===')
          for i,line in enumerate(t.splitlines(),1):
              if re.match(r'^(?:static\s+)?func\s+', line):
                  print(f'{i}: {line}')
          print('=== WORLDDATA EXTERNAL REFERENCES ===')
          refs={}
          for q in Path('scripts').rglob('*.gd'):
              if q==p: continue
              s=q.read_text(encoding='utf-8')
              names=sorted(set(re.findall(r'\bWorldData\.([A-Za-z_][A-Za-z0-9_]*)', s)))
              if names:
                  refs[str(q)]=names
          for q,names in refs.items():
              print(q+': '+', '.join(names))
          PY
