name: Pass 12 Refactor V4

on:
  push:
    branches:
      - agent/pass12-remove-city-workspace

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass12-remove-city-workspace
          fetch-depth: 0

      - name: Apply final Pass 12 migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Reuse the already-reviewed base transformation, but postpone its
          # deliberately strict setter assertion until after exact write repair.
          wf = Path('.github/workflows/pass12-refactor.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = wf.index(marker) + len(marker)
          end = wf.index("\n          PY\n", start)
          code = wf[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in code.splitlines())
          code = code.replace("assert not bad, '\\n'.join(bad)", "pass")
          exec(compile(code, '<pass12-base>', 'exec'), {})

          # Add explicit setters for low-level/bootstrap paths that historically
          # assigned the compatibility workspace directly.
          p = Path('scripts/world/simulation/WorldPoliticalState.gd')
          t = p.read_text(encoding='utf-8')
          needle = 'func store_current_city_world(city_world, city_seed: int) -> void:\n'
          assert needle in t
          setters = '''func set_current_city_world(city_world) -> void:\n\tvar active_city_state = get_active_city_simulation_state()\n\tif active_city_state != null:\n\t\tactive_city_state.city_world = city_world\n\t\treturn\n\t_unbound_city_world = city_world\n\n\nfunc set_current_city_seed(city_seed: int) -> void:\n\tvar active_city_state = get_active_city_simulation_state()\n\tif active_city_state != null:\n\t\tactive_city_state.city_seed = city_seed\n\t\treturn\n\t_unbound_city_seed = city_seed\n\n\n'''
          t = t.replace(needle, setters + needle, 1)
          p.write_text(t, encoding='utf-8')

          ASSIGN_RE = re.compile(r'^(\s*)WorldPoliticalState\.get_current_city_(world|seed|runtime_data)\(\)\s*(?<![=!<>])=(?!=)\s*(.*)$')

          def repair_assignments(path: Path) -> None:
              lines = path.read_text(encoding='utf-8').splitlines()
              out = []
              i = 0
              while i < len(lines):
                  line = lines[i]
                  m = ASSIGN_RE.match(line)
                  if not m:
                      out.append(line)
                      i += 1
                      continue
                  indent, kind, rhs = m.groups()
                  setter = {
                      'world': 'set_current_city_world',
                      'seed': 'set_current_city_seed',
                      'runtime_data': 'replace_current_city_runtime_data',
                  }[kind]
                  # Common scalar/simple-expression setter.
                  if rhs.strip() != '{':
                      out.append(f'{indent}WorldPoliticalState.{setter}({rhs})')
                      i += 1
                      continue
                  # Multiline dictionary assignment. Preserve the dictionary body
                  # byte-for-byte and wrap only the former assignment boundary.
                  out.append(f'{indent}WorldPoliticalState.{setter}({{')
                  depth = 1
                  i += 1
                  while i < len(lines):
                      current = lines[i]
                      # These fixtures contain ordinary dictionary literals only;
                      # counting braces is sufficient and avoids reformatting them.
                      depth += current.count('{') - current.count('}')
                      if depth == 0:
                          # Replace the dictionary's final closing brace with `})`.
                          close_index = current.rfind('}')
                          assert close_index >= 0
                          out.append(current[:close_index] + '})' + current[close_index + 1:])
                          i += 1
                          break
                      out.append(current)
                      i += 1
                  else:
                      raise AssertionError(f'unclosed runtime dictionary assignment in {path}')
              path.write_text('\n'.join(out) + '\n', encoding='utf-8')

          for gp in Path('scripts').glob('**/*.gd'):
              repair_assignments(gp)

          # The dedicated Pass 12 test intentionally mutates the dictionary
          # returned by the current owner. That is not a setter and must remain.
          bad = []
          true_assignment = re.compile(r'WorldPoliticalState\.get_current_city_(?:world|seed|runtime_data)\(\)\s*(?<![=!<>])=(?!=)')
          for gp in Path('scripts').glob('**/*.gd'):
              s = gp.read_text(encoding='utf-8')
              for tok in ('WorldData.official_city_world', 'WorldData.official_city_seed', 'WorldData.player_city_data'):
                  if tok in s:
                      bad.append(f'{gp}: retired {tok}')
              if true_assignment.search(s):
                  bad.append(f'{gp}: assignment to current-city getter')
          assert not bad, '\n'.join(bad)
          PY

      - name: Commit Pass 12 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts ci/audit_gdscript.py
          git commit -m "Pass 12: remove WorldData city compatibility workspace"
          git push origin HEAD:agent/pass12-remove-city-workspace
