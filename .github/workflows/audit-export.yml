name: Paladin audit export

on:
  push:
    branches:
      - paladin/intensive-debug-performance-cleanup
    paths:
      - .github/workflows/audit-export.yml
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'paladin/intensive-debug-performance-cleanup' || github.ref == 'refs/heads/paladin/intensive-debug-performance-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/paladin-audit-source.tar.gz .
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: paladin-audit-source
          path: /tmp/paladin-audit-source.tar.gz
          retention-days: 1
