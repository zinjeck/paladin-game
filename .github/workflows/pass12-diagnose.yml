name: Pass 12 Diagnose

on:
  push:
    branches:
      - agent/pass12-remove-city-workspace

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass12-remove-city-workspace
      - name: Print transformed setter contexts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          wf = Path('.github/workflows/pass12-refactor.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = wf.index(marker) + len(marker)
          end = wf.index("\n          PY\n", start)
          code = wf[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in code.splitlines())
          code = code.replace("assert not bad, '\\n'.join(bad)", "pass")
          exec(compile(code, '<pass12-diagnose-base>', 'exec'), {})
          for gp in Path('scripts').glob('**/*.gd'):
              lines = gp.read_text(encoding='utf-8').splitlines()
              for i, line in enumerate(lines):
                  if re.search(r'get_current_city_(?:world|seed|runtime_data)\(\)\s*=', line):
                      print(f'--- {gp}:{i+1} ---')
                      for j in range(max(0,i-2), min(len(lines),i+5)):
                          print(f'{j+1}: {lines[j]}')
          PY
