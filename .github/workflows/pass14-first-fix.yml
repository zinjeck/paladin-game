name: Pass 14 First Fix
on:
  push:
    branches: [agent/pass14-worlddata-final-boundary]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass14-worlddata-final-boundary
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          wp = Path('scripts/world/simulation/WorldData.gd')
          w = wp.read_text(encoding='utf-8')
          w = w.replace('#region City Object Definitions and Workplace Policies\n\n', '', 1)
          wp.write_text(w, encoding='utf-8')

          ap = Path('ci/audit_gdscript.py')
          a = ap.read_text(encoding='utf-8')
          old = '''        for symbol in WORLD_DATA_FINAL_FORBIDDEN_CITY_SYMBOLS:\n            if re.search(rf"\\b{re.escape(symbol)}\\b", world_data_text):\n                errors.append(\n                    "scripts/world/simulation/WorldData.gd: Pass 14 final boundary "\n                    f"forbids city-only symbol: {symbol}"\n                )\n'''
          new = '''        for symbol in WORLD_DATA_FINAL_FORBIDDEN_CITY_SYMBOLS:\n            if symbol in {"CityCitizensScript", "CityObjectCatalogScript"}:\n                forbidden = symbol in world_data_text\n            else:\n                forbidden = bool(re.search(\n                    rf"^\\s*(?:(?:static\\s+)?(?:const|var)\\s+{re.escape(symbol)}\\b|(?:static\\s+)?func\\s+{re.escape(symbol)}\\s*\\()",\n                    world_data_text,\n                    re.MULTILINE,\n                ))\n            if forbidden:\n                errors.append(\n                    "scripts/world/simulation/WorldData.gd: Pass 14 final boundary "\n                    f"forbids city-only declaration: {symbol}"\n                )\n'''
          assert old in a
          a = a.replace(old, new, 1)
          ap.write_text(a, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/world/simulation/WorldData.gd ci/audit_gdscript.py
          git commit -m "Pass 14: correct final boundary audit"
          git push origin HEAD:agent/pass14-worlddata-final-boundary
