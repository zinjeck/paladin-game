name: Apply Construction State Extraction

on:
  push:
    branches:
      - agent/extract-city-construction-state

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[construction-state-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/extract-city-construction-state
          fetch-depth: 0
      - name: Apply guarded construction-state extraction
        run: python3 ci/refactor_city_construction_state.py
      - name: Commit transformed source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts ci/audit_gdscript.py
          git diff --cached --check
          git commit -m "Extract city construction state from WorldData [construction-state-applied]"
          git push origin HEAD:agent/extract-city-construction-state
