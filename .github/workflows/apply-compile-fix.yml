name: Apply compile fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'paladin/intensive-debug-performance-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: paladin/intensive-debug-performance-cleanup
          fetch-depth: 0

      - name: Apply verified compile fixes
        run: python3 ci/apply_compile_fix.py

      - name: Remove temporary application files
        shell: bash
        run: |
          rm -f \
            .github/workflows/apply-compile-fix.yml \
            ci/apply_compile_fix.py \
            ci/compile_fix_payload.txt

      - name: Commit compile fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "paladin-ci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix persistent session compile errors"
          git push origin HEAD:paladin/intensive-debug-performance-cleanup
