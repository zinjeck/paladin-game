name: Diagnose City Work Test Hang

on:
  push:
    branches:
      - agent/extract-city-work-api

permissions:
  contents: read

jobs:
  diagnose:
    name: Parallel Godot test diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out Paladin
        uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/godot-4.7.1
          key: godot-4.7.1-linux-x86-64

      - name: Install Godot 4.7.1
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          GODOT_DIR="${RUNNER_TOOL_CACHE}/godot-4.7.1"
          mkdir -p "$GODOT_DIR"
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$GODOT_DIR"
          mv "$GODOT_DIR/Godot_v4.7.1-stable_linux.x86_64" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"

      - name: Put Godot on PATH
        run: echo "${RUNNER_TOOL_CACHE}/godot-4.7.1" >> "$GITHUB_PATH"

      - name: Import project resources
        shell: bash
        run: timeout 300s godot --headless --path . --import

      - name: Run every test scene in parallel
        shell: bash
        run: |
          set -u
          mkdir -p ci-logs/parallel-diagnostic ci-logs/parallel-status
          mapfile -t scenes < <(find scripts -type f -name '*Test.tscn' -print | sort)
          echo "Launching ${#scenes[@]} test scenes in parallel with 75-second guards."

          pids=()
          names=()
          for scene in "${scenes[@]}"; do
            safe="${scene#scripts/}"
            safe="${safe//\//__}"
            safe="${safe%.tscn}"
            names+=("$safe")
            (
              set +e
              timeout 75s godot --headless --path . "res://$scene" \
                >"ci-logs/parallel-diagnostic/${safe}.log" 2>&1
              echo "$?" >"ci-logs/parallel-status/${safe}.status"
            ) &
            pids+=("$!")
          done

          for pid in "${pids[@]}"; do
            wait "$pid" || true
          done

          failures=0
          for safe in "${names[@]}"; do
            status="$(cat "ci-logs/parallel-status/${safe}.status")"
            echo
            echo "===== ${safe}: status ${status} ====="
            cat "ci-logs/parallel-diagnostic/${safe}.log"
            if [[ "$status" -ne 0 ]]; then
              failures=$((failures + 1))
            fi
          done

          echo
          echo "Parallel diagnostic failures/timeouts: $failures"
          exit "$failures"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-work-parallel-diagnostic
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 3
