name: Fix Logistics Multiline References

on:
  push:
    branches:
      - agent/extract-city-logistics-api

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[multiline-logistics-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/extract-city-logistics-api
          fetch-depth: 0
      - name: Fix multiline legacy logistics references
        run: python3 ci/fix_multiline_logistics_refs.py
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts ci/audit_gdscript.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No fixes required."
            exit 0
          fi
          git commit -m "Harden logistics API migration [multiline-logistics-fixed]"
          git push origin HEAD:agent/extract-city-logistics-api
