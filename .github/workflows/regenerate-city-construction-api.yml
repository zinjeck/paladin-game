name: Regenerate City Construction API Extraction
on:
  push:
    branches:
      - agent/extract-city-construction-api
permissions:
  contents: write
jobs:
  regenerate:
    if: "!contains(github.event.head_commit.message, '[regenerated]') && !contains(github.event.head_commit.message, '[construction-api-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore game code from current main and regenerate
        run: |
          git fetch origin main
          git checkout origin/main -- ci/audit_gdscript.py scripts
          python3 ci/refactor_city_construction_api.py
      - name: Commit regenerated extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/audit_gdscript.py scripts
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Regenerate construction API extraction from main [construction-api-applied] [regenerated]"
          git push
