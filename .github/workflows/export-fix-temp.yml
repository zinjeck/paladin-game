name: Export fix branch

on:
  push:
    branches:
      - fix/road-hover-citizen-selection
    paths:
      - .github/workflows/export-fix-temp.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Archive repository
        run: |
          zip -qr paladin-fix-branch.zip . -x '.git/*' 'paladin-fix-branch.zip'

      - name: Upload repository archive
        uses: actions/upload-artifact@v4
        with:
          name: paladin-fix-branch
          path: paladin-fix-branch.zip
          retention-days: 1
