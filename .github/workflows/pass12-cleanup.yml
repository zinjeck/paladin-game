name: Pass 12 Cleanup

on:
  push:
    branches:
      - agent/pass12-remove-city-workspace

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass12-remove-city-workspace
          fetch-depth: 0
      - name: Canonicalize WorldPoliticalState Pass 12 insertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('scripts/world/simulation/WorldPoliticalState.gd')
          t = p.read_text(encoding='utf-8')

          # Overlapping one-shot migration runs inserted these small ownership
          # blocks more than once. Collapse exact adjacent duplicates first.
          blocks = [
              '''var _unbound_city_world = null\nvar _unbound_city_seed: int = 0\nvar _unbound_city_runtime_data: Dictionary = {}\n''',
              '''\t_unbound_city_world = null\n\t_unbound_city_seed = 0\n\t_unbound_city_runtime_data = {}\n''',
              '''\tvar unbound_city_world_to_adopt = _unbound_city_world\n\tvar unbound_city_seed_to_adopt: int = _unbound_city_seed\n\tvar unbound_city_runtime_data_to_adopt: Dictionary = _unbound_city_runtime_data\n''',
              '''\t\tcapital_state.city_world = unbound_city_world_to_adopt\n\t\tcapital_state.city_seed = unbound_city_seed_to_adopt\n\t\tcapital_state.city_runtime_data = unbound_city_runtime_data_to_adopt\n''',
              '''\t\t\tcity_state.city_world = _unbound_city_world\n\t\t\tcity_state.city_seed = _unbound_city_seed\n\t\t\tcity_state.city_runtime_data = _unbound_city_runtime_data\n\t\t\t_unbound_city_world = null\n\t\t\t_unbound_city_seed = 0\n\t\t\t_unbound_city_runtime_data = {}\n''',
          ]
          for block in blocks:
              while block + block in t:
                  t = t.replace(block + block, block)

          target_functions = {
              'get_current_city_world',
              'get_current_city_seed',
              'get_current_city_runtime_data',
              'set_current_city_world',
              'set_current_city_seed',
              'store_current_city_world',
              'replace_current_city_runtime_data',
              'clear_current_city_world',
              'clear_current_city_runtime_data',
          }

          # Remove every migrated copy of the focused runtime API, then insert one
          # canonical block. Top-level functions are unindented, so the boundary is
          # unambiguous without rewriting unrelated code.
          lines = t.splitlines(keepends=True)
          out = []
          i = 0
          func_re = re.compile(r'^func\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(')
          while i < len(lines):
              m = func_re.match(lines[i])
              if not m or m.group(1) not in target_functions:
                  out.append(lines[i])
                  i += 1
                  continue
              i += 1
              while i < len(lines) and not func_re.match(lines[i]):
                  i += 1
          t = ''.join(out)

          canonical = '''func get_current_city_world():\n\tvar active_city_state = get_active_city_simulation_state()\n\tif active_city_state != null:\n\t\treturn active_city_state.city_world\n\treturn _unbound_city_world\n\n\nfunc get_current_city_seed() -> int:\n\tvar active_city_state = get_active_city_simulation_state()\n\tif active_city_state != null:\n\t\treturn active_city_state.city_seed\n\treturn _unbound_city_seed\n\n\nfunc get_current_city_runtime_data() -> Dictionary:\n\tvar active_city_state = get_active_city_simulation_state()\n\tif active_city_state != null:\n\t\treturn active_city_state.city_runtime_data\n\treturn _unbound_city_runtime_data\n\n\nfunc set_current_city_world(city_world) -> void:\n\tvar active_city_state = get_active_city_simulation_state()\n\tif active_city_state != null:\n\t\tactive_city_state.city_world = city_world\n\t\treturn\n\t_unbound_city_world = city_world\n\n\nfunc set_current_city_seed(city_seed: int) -> void:\n\tvar active_city_state = get_active_city_simulation_state()\n\tif active_city_state != null:\n\t\tactive_city_state.city_seed = city_seed\n\t\treturn\n\t_unbound_city_seed = city_seed\n\n\nfunc store_current_city_world(city_world, city_seed: int) -> void:\n\tvar active_city_state = get_active_city_simulation_state()\n\tif active_city_state != null:\n\t\tactive_city_state.city_world = city_world\n\t\tactive_city_state.city_seed = city_seed\n\t\treturn\n\t_unbound_city_world = city_world\n\t_unbound_city_seed = city_seed\n\n\nfunc replace_current_city_runtime_data(values: Dictionary) -> void:\n\tvar active_city_state = get_active_city_simulation_state()\n\tif active_city_state != null:\n\t\tactive_city_state.city_runtime_data = values\n\t\treturn\n\t_unbound_city_runtime_data = values\n\n\nfunc clear_current_city_world() -> void:\n\tvar active_city_state = get_active_city_simulation_state()\n\tif active_city_state != null:\n\t\tactive_city_state.city_world = null\n\t\tactive_city_state.city_seed = 0\n\t\treturn\n\t_unbound_city_world = null\n\t_unbound_city_seed = 0\n\n\nfunc clear_current_city_runtime_data() -> void:\n\tvar active_city_state = get_active_city_simulation_state()\n\tif active_city_state != null:\n\t\tactive_city_state.city_runtime_data = {}\n\t\treturn\n\t_unbound_city_runtime_data = {}\n\n\n'''
          anchor = 'func get_polity_snapshot() -> Array[Dictionary]:\n'
          assert anchor in t
          t = t.replace(anchor, canonical + anchor, 1)

          # `capture_from_world_data` is retired. Any surviving occurrences in
          # this file must be explanatory comments from old migration notes, never code.
          cleaned = []
          for line in t.splitlines(keepends=True):
              if 'capture_from_world_data' in line:
                  assert line.lstrip().startswith('#'), 'live capture_from_world_data call survived Pass 12'
                  line = line.replace('capture_from_world_data()', 'the retired compatibility capture hook')
                  line = line.replace('capture_from_world_data', 'retired compatibility capture hook')
              cleaned.append(line)
          t = ''.join(cleaned)

          # Sanity: exactly one declaration/function for every new owner/API.
          assert t.count('var _unbound_city_world = null') == 1
          assert t.count('var _unbound_city_seed: int = 0') == 1
          assert t.count('var _unbound_city_runtime_data: Dictionary = {}') == 1
          for name in target_functions:
              assert len(re.findall(rf'^func\s+{re.escape(name)}\s*\(', t, re.M)) == 1, name
          assert 'capture_from_world_data' not in t

          p.write_text(t, encoding='utf-8')
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/world/simulation/WorldPoliticalState.gd
          git commit -m "Pass 12: canonicalize direct city runtime ownership"
          git push origin HEAD:agent/pass12-remove-city-workspace
