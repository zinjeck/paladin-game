name: Logistics Inventory

on:
  push:
    branches:
      - agent/extract-city-logistics

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory logistics ownership and callers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          world = root / 'scripts/world/simulation/WorldData.gd'
          text = world.read_text(encoding='utf-8')

          print('=== WorldData logistics declarations ===')
          for i, line in enumerate(text.splitlines(), 1):
              if re.search(r'city_ground_pile|city_haul_reservation|CITY_GROUND_PILE|CITY_GROUND_DROP_RESERVATION', line):
                  if re.search(r'^\s*(?:static\s+var|const|(?:static\s+)?func)\b', line):
                      print(f'{i}: {line.strip()}')

          print('\n=== WorldData logistics-related functions ===')
          for m in re.finditer(r'(?m)^\s*(?:static\s+)?func\s+([A-Za-z0-9_]+)\s*\(', text):
              name = m.group(1)
              if any(term in name for term in ('ground_pile', 'haul_reservation', 'haul_endpoint')):
                  print(name)

          print('\n=== Cross-file WorldData logistics references ===')
          pattern = re.compile(r'WorldData\.([A-Za-z0-9_]*(?:ground_pile|haul_reservation|haul_endpoint)[A-Za-z0-9_]*)')
          refs = {}
          for path in sorted((root / 'scripts').rglob('*.gd')):
              if path == world:
                  continue
              ptext = path.read_text(encoding='utf-8')
              names = sorted(set(pattern.findall(ptext)))
              if names:
                  refs[str(path)] = names
          for path, names in refs.items():
              print(path)
              for name in names:
                  print(f'  {name}')

          print('\n=== Direct logistics field references outside WorldData ===')
          field_pattern = re.compile(r'WorldData\.(city_ground_piles|city_ground_pile_index_by_id|next_city_ground_pile_id|city_haul_reservations|city_haul_reservation_id_by_citizen_id|city_haul_source_reserved_amount_by_key|city_haul_destination_reserved_amount_by_key|next_city_haul_reservation_id|city_ground_pile_version|city_haul_reservation_version)\b')
          for path in sorted((root / 'scripts').rglob('*.gd')):
              if path == world:
                  continue
              ptext = path.read_text(encoding='utf-8')
              hits = sorted(set(field_pattern.findall(ptext)))
              if hits:
                  print(path + ': ' + ', '.join(hits))
          PY
