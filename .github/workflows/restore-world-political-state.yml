name: Restore Current Political State

on:
  push:
    branches:
      - agent/extract-city-work-api

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Restore current main implementations and apply minimal work-state seam
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            scripts/world/simulation/WorldPoliticalState.gd \
            scripts/world/simulation/SettlementSimulationContext.gd

          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/world/simulation/WorldPoliticalState.gd')
          text = path.read_text(encoding='utf-8')

          old_signature = 'func get_current_city_work_state():'
          if text.count(old_signature) != 1:
              raise RuntimeError(
                  'Expected exactly one current work-state getter signature.'
              )
          text = text.replace(
              old_signature,
              'func get_current_city_work_state() -> CityWorkState:',
              1,
          )

          anchor = '''\treturn _unbound_city_work_state\n\n\nfunc get_polity_snapshot()'''
          replacement = '''\treturn _unbound_city_work_state\n\n\n# WorldData still owns the legacy city-session reset entry point while local\n# subsystems are extracted. Keep that entry point generic: it asks the local\n# ownership registry to reset extracted state without knowing work internals.\nfunc reset_extracted_city_state() -> void:\n\tget_current_city_work_state().reset_all()\n\n\nfunc get_polity_snapshot()'''
          if text.count(anchor) != 1:
              raise RuntimeError(
                  'Expected exactly one work-state reset insertion anchor.'
              )
          text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit restored implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/world/simulation/WorldPoliticalState.gd \
            scripts/world/simulation/SettlementSimulationContext.gd
          git commit -m "Restore current settlement switching implementation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
