name: One-time Finalize City Work API

on:
  push:
    branches:
      - agent/extract-city-work-api

permissions:
  contents: write

jobs:
  apply-refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply final city work API cleanup
        run: python3 ci/one_time_finalize_city_work_api.py

      - name: Commit generated cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts ci/audit_gdscript.py
          git commit -m "Finalize city work API extraction"
          git push origin "HEAD:${GITHUB_REF_NAME}"
