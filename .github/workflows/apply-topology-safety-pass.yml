name: Apply topology safety pass

on:
  push:
    branches:
      - fix/topology-safe-construction-finalization

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/topology-safe-construction-finalization

      - name: Apply asserted source transformations
        run: python3 ci/apply_topology_safety_pass.py

      - name: Run static GDScript audit
        run: python3 ci/audit_gdscript.py

      - name: Check generated diff
        run: git diff --check

      - name: Commit generated pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/godot-ci.yml \
            scripts/world/simulation/WorldData.gd \
            scripts/city/simulation/systems/CityConstructionSystem.gd \
            scripts/citizens/simulation/systems/CitizenMovementSystem.gd \
            scripts/city/simulation/CityTopologySafetyTest.gd \
            scripts/city/simulation/CityTopologySafetyTest.tscn
          git commit -m "Make construction finalization topology-safe"
          git push origin HEAD:fix/topology-safe-construction-finalization
