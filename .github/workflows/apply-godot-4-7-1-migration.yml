name: Apply Godot 4.7.1 migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: github.head_ref == 'migration/godot-4.7.1'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update project and CI engine version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          project = Path('project.godot')
          project_text = project.read_text(encoding='utf-8')
          old_feature = 'config/features=PackedStringArray("4.4", "Forward Plus")'
          new_feature = 'config/features=PackedStringArray("4.7", "Forward Plus")'
          if old_feature not in project_text:
              raise SystemExit('Expected Godot 4.4 project feature marker was not found.')
          project.write_text(project_text.replace(old_feature, new_feature), encoding='utf-8')

          workflow = Path('.github/workflows/godot-ci.yml')
          workflow_text = workflow.read_text(encoding='utf-8')
          replacements = {
              'Godot 4.4.1 headless tests': 'Godot 4.7.1 headless tests',
              'godot-4.4.1': 'godot-4.7.1',
              'Godot 4.4.1': 'Godot 4.7.1',
              '4.4.1-stable': '4.7.1-stable',
              'Godot_v4.4.1-stable_linux.x86_64': 'Godot_v4.7.1-stable_linux.x86_64',
          }
          for old, new in replacements.items():
              workflow_text = workflow_text.replace(old, new)
          if '4.4.1' in workflow_text:
              raise SystemExit('A Godot 4.4.1 reference remains in godot-ci.yml.')
          workflow.write_text(workflow_text, encoding='utf-8')
          PY

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          GODOT_DIR="${RUNNER_TOOL_CACHE}/godot-4.7.1"
          mkdir -p "$GODOT_DIR"
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$GODOT_DIR"
          mv "$GODOT_DIR/Godot_v4.7.1-stable_linux.x86_64" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"
          echo "$GODOT_DIR" >> "$GITHUB_PATH"

      - name: Show Godot version
        run: godot --version

      - name: Audit GDScript structure and resource paths
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python3 ci/audit_gdscript.py 2>&1 | tee ci-logs/static-audit.log

      - name: Import with Godot 4.7.1
        shell: bash
        run: |
          set -o pipefail
          timeout 300s godot --headless --path . --import 2>&1 | tee ci-logs/import-4.7.1.log

      - name: Run full Paladin suite with Godot 4.7.1
        shell: bash
        run: bash ci/run_godot_tests.sh

      - name: Remove one-time migration workflow
        run: rm .github/workflows/apply-godot-4-7-1-migration.yml

      - name: Commit migration baseline
        shell: bash
        run: |
          set -euo pipefail
          git add project.godot .github/workflows/godot-ci.yml .github/workflows/apply-godot-4-7-1-migration.yml
          git commit -m "Migrate project and CI baseline to Godot 4.7.1"
          git push origin HEAD:${{ github.head_ref }}
