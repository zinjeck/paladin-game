name: One-shot food fairness test patch

on:
  push:
    branches:
      - feature/food-allocation-and-safe-popups

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/food-allocation-and-safe-popups

      - name: Update the legacy reservation accounting fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/city/simulation/CityUnifiedWorkSystemTest.gd')
          text = path.read_text(encoding='utf-8')

          old_citizens = '''\tvar first := _add_hungry_citizen("First", Vector2i(8, 9))
          \tvar second := _add_hungry_citizen("Second", Vector2i(8, 10))
          \tvar third := _add_hungry_citizen("Third", Vector2i(8, 11))
          '''
          new_citizens = '''\tvar first := _add_hungry_citizen("First", Vector2i(8, 9))
          \tvar second := _add_hungry_citizen("Second", Vector2i(8, 10))
          \tvar third := _add_hungry_citizen("Third", Vector2i(8, 11))
          \tvar fourth := _add_hungry_citizen("Fourth", Vector2i(8, 12))
          '''

          old_assertions = '''\tvar third_match := CityResourceMatcherScript.find_best_survival_food_source(
          \t\tthird,
          \t\t100,
          \t\t10,
          \t\t32
          \t)
          \t_expect(
          \t\tint(third_match.get("source_id", -1)) <= 0,
          \t\t"Fully reserved workplace and ground food must not be promised to a third citizen."
          \t)
          \t_expect(
          \t\tWorldData.get_city_food_endpoint_unreserved_amount(
          \t\t\tint(third.get("id", -1)),
          \t\t\tWorldData.make_city_ground_pile_haul_endpoint(pile_id),
          \t\t\tWorldData.RESOURCE_FISH
          \t\t) == 0,
          \t\t"Food endpoint availability must subtract competing task reservations."
          \t)
          '''
          new_assertions = '''\tvar third_match := CityResourceMatcherScript.find_best_survival_food_source(
          \t\tthird,
          \t\t100,
          \t\t10,
          \t\t32
          \t)
          \t_expect(
          \t\tstr(third_match.get("source_kind", ""))
          \t\t== WorldData.CITY_CITIZEN_HAUL_ENDPOINT_KIND_GROUND_PILE
          \t\tand int(third_match.get("source_id", -1)) == pile_id,
          \t\t"One-item allocation must leave the pile's second fish available to a third hungry citizen."
          \t)
          \t_expect(
          \t\t_assign_food_match(int(third.get("id", -1)), third_match),
          \t\t"Assigning the third food request must reserve the pile's final fish."
          \t)

          \tvar fourth_match := CityResourceMatcherScript.find_best_survival_food_source(
          \t\tfourth,
          \t\t100,
          \t\t10,
          \t\t32
          \t)
          \t_expect(
          \t\tint(fourth_match.get("source_id", -1)) <= 0,
          \t\t"Three fully reserved fish must not be promised to a fourth citizen."
          \t)
          \t_expect(
          \t\tWorldData.get_city_food_endpoint_unreserved_amount(
          \t\t\tint(fourth.get("id", -1)),
          \t\t\tWorldData.make_city_ground_pile_haul_endpoint(pile_id),
          \t\t\tWorldData.RESOURCE_FISH
          \t\t) == 0,
          \t\t"Food endpoint availability must subtract all competing one-item task reservations."
          \t)
          '''

          if text.count(old_citizens) != 1:
              raise SystemExit('Expected hungry-citizen fixture block was not found exactly once.')
          if text.count(old_assertions) != 1:
              raise SystemExit('Expected reservation assertion block was not found exactly once.')

          text = text.replace(old_citizens, new_citizens)
          text = text.replace(old_assertions, new_assertions)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/one-shot-food-fairness-test-patch.yml').unlink()
          PY

      - name: Commit the updated regression and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/city/simulation/CityUnifiedWorkSystemTest.gd
          git add .github/workflows/one-shot-food-fairness-test-patch.yml
          git commit -m "Update reservation accounting for fair one-item claims"
          git push origin HEAD:feature/food-allocation-and-safe-popups
