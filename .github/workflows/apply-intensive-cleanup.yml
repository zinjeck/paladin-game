name: Apply intensive cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'paladin/intensive-debug-performance-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: paladin/intensive-debug-performance-cleanup
          fetch-depth: 0

      - name: Apply verified cleanup payload
        run: python3 ci/apply_intensive_cleanup.py

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "paladin-ci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply intensive logic and performance cleanup"
          git push origin HEAD:paladin/intensive-debug-performance-cleanup
