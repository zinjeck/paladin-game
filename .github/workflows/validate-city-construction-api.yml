name: Validate City Construction API Extraction
on:
  push:
    branches:
      - agent/extract-city-construction-api
permissions:
  contents: read
concurrency:
  group: construction-api-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache-godot
        with:
          path: ${{ runner.tool_cache }}/godot-4.7.1
          key: godot-4.7.1-linux-x86-64
      - name: Install Godot 4.7.1
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          GODOT_DIR="${RUNNER_TOOL_CACHE}/godot-4.7.1"
          mkdir -p "$GODOT_DIR"
          curl --fail --location --retry 3 --output /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$GODOT_DIR"
          mv "$GODOT_DIR/Godot_v4.7.1-stable_linux.x86_64" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"
      - name: Put Godot on PATH
        run: echo "${RUNNER_TOOL_CACHE}/godot-4.7.1" >> "$GITHUB_PATH"
      - name: Static audit
        run: python3 ci/audit_gdscript.py
      - name: Compile/import
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          timeout 300s godot --headless --path . --import 2>&1 | tee ci-logs/import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|Failed to create an autoload" ci-logs/import.log; then
            echo "Godot import reported script compilation errors."
            exit 1
          fi
