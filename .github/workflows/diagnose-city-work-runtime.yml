name: Diagnose City Work Runtime

on:
  push:
    branches:
      - agent/extract-city-work-api

permissions:
  contents: read

jobs:
  diagnose:
    name: Parallel city work runtime diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Check out Paladin
        uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/godot-4.7.1
          key: godot-4.7.1-linux-x86-64

      - name: Install Godot 4.7.1
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          GODOT_DIR="${RUNNER_TOOL_CACHE}/godot-4.7.1"
          mkdir -p "$GODOT_DIR"
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$GODOT_DIR"
          mv "$GODOT_DIR/Godot_v4.7.1-stable_linux.x86_64" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"

      - name: Put Godot on PATH
        run: echo "${RUNNER_TOOL_CACHE}/godot-4.7.1" >> "$GITHUB_PATH"

      - name: Import project resources
        shell: bash
        run: |
          set -o pipefail
          timeout 300s godot --headless --path . --import 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR:|Failed to load script" /tmp/import.log; then
            echo "Import contained script errors."
            exit 1
          fi

      - name: Run all test scenes in parallel
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/paladin-diag
          mapfile -t scenes < <(find scripts -type f -name '*Test.tscn' -print | sort)
          pids=()
          names=()
          for scene in "${scenes[@]}"; do
            safe="${scene#scripts/}"
            safe="${safe//\//__}"
            safe="${safe%.tscn}"
            names+=("$safe")
            (
              set +e
              timeout 60s godot --headless --path . "res://$scene" \
                >"/tmp/paladin-diag/${safe}.log" 2>&1
              echo "$?" >"/tmp/paladin-diag/${safe}.status"
            ) &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid" || true
          done

          failures=0
          for safe in "${names[@]}"; do
            status="$(cat "/tmp/paladin-diag/${safe}.status")"
            echo
            echo "===== ${safe}: status ${status} ====="
            cat "/tmp/paladin-diag/${safe}.log"
            if [[ "$status" -ne 0 ]]; then
              failures=$((failures + 1))
            fi
          done
          echo
          echo "Parallel diagnostic failures/timeouts: $failures"
          exit "$failures"
