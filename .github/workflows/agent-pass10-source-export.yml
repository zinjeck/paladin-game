name: Agent Pass 10 implementation transfer

on:
  push:
    branches:
      - agent/assignment-housing-employment-cleanup

permissions:
  contents: write

jobs:
  apply:
    name: Apply reviewed Pass 10 commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/assignment-housing-employment-cleanup
          fetch-depth: 0

      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/pass10-transfer/chunk-* > /tmp/pass10.patch.gz.b64
          base64 --decode /tmp/pass10.patch.gz.b64 | gzip --decompress > /tmp/pass10.patch
          git apply --check /tmp/pass10.patch
          git apply /tmp/pass10.patch
          rm -rf .github/pass10-transfer
          rm -f .github/workflows/agent-pass10-source-export.yml
          git diff --check
          python3 ci/audit_gdscript.py
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract city assignment and workplace ownership"
          git push origin HEAD:agent/assignment-housing-employment-cleanup
