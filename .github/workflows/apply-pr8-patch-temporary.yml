name: Apply PR 8 Patch Temporary

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.head_ref == 'refactor/city-systems-explicit-state-only-redo'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: refactor/city-systems-explicit-state-only-redo
          fetch-depth: 0

      - name: Apply local PR 8 closure tree and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          cat .github/pr8-payload/part* | base64 --decode | gzip --decompress > /tmp/pr8.patch
          git apply --index /tmp/pr8.patch
          git rm -r .github/pr8-payload
          git rm .github/workflows/apply-pr8-patch-temporary.yml
          git rm .github/workflows/export-pr8-source-temporary.yml
          git config user.name "Paladin CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "refactor: close PR 8 city-state ownership boundaries"
          git push origin HEAD:refactor/city-systems-explicit-state-only-redo
