name: Pass 14 Compile Fix
on:
  push:
    branches: [agent/pass14-worlddata-final-boundary]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass14-worlddata-final-boundary
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('scripts')
          cit=Path('scripts/citizens/simulation/CityCitizens.gd').read_text(encoding='utf-8')
          catp=Path('scripts/city/data/CityObjectCatalog.gd')
          cat=catp.read_text(encoding='utf-8')
          cit_syms=set(re.findall(r'^(?:static\s+)?const\s+([A-Za-z_][A-Za-z0-9_]*)\b',cit,re.M))|set(re.findall(r'^static\s+func\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(',cit,re.M))
          cat_syms=set(re.findall(r'^(?:static\s+)?const\s+([A-Za-z_][A-Za-z0-9_]*)\b',cat,re.M))|set(re.findall(r'^static\s+func\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(',cat,re.M))
          if 'static func get_city_object_definition_from_object(' not in cat:
              cat += '''\n\nstatic func get_city_object_definition_from_object(city_object: Dictionary) -> Dictionary:\n\tif city_object.is_empty():\n\t\treturn {}\n\treturn get_city_object_definition(str(city_object.get("type", "")))\n'''
              catp.write_text(cat,encoding='utf-8')
              cat_syms.add('get_city_object_definition_from_object')
          for p in root.rglob('*.gd'):
              if p.name=='WorldData.gd':
                  continue
              t=p.read_text(encoding='utf-8')
              for s in cit_syms:
                  t=t.replace('WorldData.'+s,'CityCitizens.'+s)
              for s in cat_syms:
                  t=t.replace('WorldData.'+s,'CityObjectCatalog.'+s)
              t=t.replace('WorldData._get_city_object_definition_dictionary','CityObjectCatalog._get_city_object_definition_dictionary')
              t=t.replace('CityCitizensScript.','CityCitizens.')
              if p.name=='CityObjectSystem.gd':
                  t=t.replace('CityObjectCatalogScript.','CityObjectCatalog.')
              if p.name=='CityLogisticsSystem.gd':
                  t=t.replace('static func CityLogisticsSystem.reserve_city_haul_destination(', 'static func reserve_city_haul_destination(')
              if p.name=='WorkplaceProductionSystem.gd':
                  t=re.sub(r'(?<![\.A-Za-z0-9_])city_object_is_workplace\(', 'CityObjectCatalog.city_object_is_workplace(', t)
              p.write_text(t,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts
          git commit -m "Pass 14: finish focused-owner caller migration"
          git push origin HEAD:agent/pass14-worlddata-final-boundary
