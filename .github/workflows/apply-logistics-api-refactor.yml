name: Apply Logistics API Refactor

on:
  push:
    branches:
      - agent/extract-city-logistics-api

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[logistics-api-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/extract-city-logistics-api
          fetch-depth: 0
      - name: Apply guarded refactor
        run: python3 ci/refactor_city_logistics_api.py
      - name: Commit transformed source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts ci/audit_gdscript.py
          git diff --cached --check
          git commit -m "Extract city logistics APIs from WorldData [logistics-api-applied]"
          git push origin HEAD:agent/extract-city-logistics-api
