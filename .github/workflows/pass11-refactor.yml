name: Pass 11 Refactor

on:
  push:
    branches:
      - agent/pass11-worlddata-audit

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass11-worlddata-audit
          fetch-depth: 0

      - name: Apply deterministic Pass 11 extraction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def read(path):
              return (root / path).read_text(encoding='utf-8')

          def write(path, text):
              (root / path).write_text(text, encoding='utf-8')

          # CitySettlementSimulationState: cache is directly settlement-owned and
          # deliberately excluded from the legacy capture/apply workspace.
          path = 'scripts/city/simulation/CitySettlementSimulationState.gd'
          text = read(path)
          text = text.replace(
              'var construction_state: CityConstructionState = CityConstructionState.new()\n\nvar object_access_tile_cache: Dictionary = {}\n',
              'var construction_state: CityConstructionState = CityConstructionState.new()\nvar navigation_state: CityNavigationState = CityNavigationState.new()\n'
          )
          text = text.replace('\n\tobject_access_tile_cache = WorldData.city_object_access_tile_cache\n', '\n')
          text = text.replace('\n\tWorldData.city_object_access_tile_cache = object_access_tile_cache\n', '\n')
          write(path, text)

          # WorldPoliticalState: add pre-context and settlement-local navigation owners.
          path = 'scripts/world/simulation/WorldPoliticalState.gd'
          text = read(path)
          needle = '''const CityConstructionStateScript = preload(\n\t"res://scripts/city/simulation/CityConstructionState.gd"\n)\n'''
          replacement = needle + '''const CityNavigationStateScript = preload(\n\t"res://scripts/city/simulation/CityNavigationState.gd"\n)\n'''
          assert needle in text
          text = text.replace(needle, replacement, 1)
          needle = 'var _unbound_city_construction_state = CityConstructionStateScript.new()\n'
          replacement = needle + 'var _unbound_city_navigation_state = CityNavigationStateScript.new()\n'
          assert needle in text
          text = text.replace(needle, replacement, 1)
          needle = '\t_unbound_city_construction_state = CityConstructionStateScript.new()\n'
          replacement = needle + '\t_unbound_city_navigation_state = CityNavigationStateScript.new()\n'
          assert needle in text
          text = text.replace(needle, replacement, 1)
          needle = '\tvar unbound_construction_state_to_adopt = _unbound_city_construction_state\n'
          replacement = needle + '\tvar unbound_navigation_state_to_adopt = _unbound_city_navigation_state\n'
          assert needle in text
          text = text.replace(needle, replacement, 1)
          needle = '\t\tcapital_state.construction_state = unbound_construction_state_to_adopt\n'
          replacement = needle + '\t\tcapital_state.navigation_state = unbound_navigation_state_to_adopt\n'
          assert needle in text
          text = text.replace(needle, replacement, 1)
          needle = '''\t\t\tcity_state.citizen_task_runtime_state = (\n\t\t\t\t_unbound_city_citizen_task_runtime_state\n\t\t\t)\n\t\t\t_unbound_city_citizen_task_runtime_state = (\n\t\t\t\tCityCitizenTaskRuntimeStateScript.new()\n\t\t\t)\n\t\t\tcity_state.capture_from_world_data()\n'''
          replacement = '''\t\t\tcity_state.citizen_task_runtime_state = (\n\t\t\t\t_unbound_city_citizen_task_runtime_state\n\t\t\t)\n\t\t\t_unbound_city_citizen_task_runtime_state = (\n\t\t\t\tCityCitizenTaskRuntimeStateScript.new()\n\t\t\t)\n\t\t\tcity_state.navigation_state = _unbound_city_navigation_state\n\t\t\t_unbound_city_navigation_state = CityNavigationStateScript.new()\n\t\t\tcity_state.capture_from_world_data()\n'''
          assert needle in text
          text = text.replace(needle, replacement, 1)
          needle = '''func get_current_city_construction_state() -> CityConstructionState:\n\tvar active_city_state = get_active_city_simulation_state()\n\tif (\n\t\tactive_city_state != null\n\t\tand active_city_state.construction_state is CityConstructionState\n\t):\n\t\treturn active_city_state.construction_state\n\treturn _unbound_city_construction_state\n'''
          replacement = needle + '''\n\nfunc get_current_city_navigation_state() -> CityNavigationState:\n\tvar active_city_state = get_active_city_simulation_state()\n\tif (\n\t\tactive_city_state != null\n\t\tand active_city_state.navigation_state is CityNavigationState\n\t):\n\t\treturn active_city_state.navigation_state\n\treturn _unbound_city_navigation_state\n'''
          assert needle in text
          text = text.replace(needle, replacement, 1)
          write(path, text)

          # CityNavigationSystem becomes the access-tile behavior/cache owner.
          path = 'scripts/city/simulation/systems/CityNavigationSystem.gd'
          text = read(path)
          insertion_point = 'const HEAP_TILE_INDEX: int = 0\n'
          assert insertion_point in text
          block = '''static func get_current_state() -> CityNavigationState:\n\treturn WorldPoliticalState.get_current_city_navigation_state()\n\n\nstatic func reset_city_navigation_state() -> void:\n\tget_current_state().object_access_tile_cache.clear()\n\n\nstatic func _sort_city_tiles_y_then_x(\n\ttile_a: Vector2i,\n\ttile_b: Vector2i\n) -> bool:\n\tif tile_a.y == tile_b.y:\n\t\treturn tile_a.x < tile_b.x\n\n\treturn tile_a.y < tile_b.y\n\n\nstatic func get_city_object_access_tiles(\n\tcity_world: WorldData,\n\tcity_object: Dictionary\n) -> Array:\n\tvar access_tiles := []\n\n\tif city_world == null or city_object.is_empty():\n\t\treturn access_tiles\n\n\tvar footprint_tiles := CityObjectSystem.get_city_object_footprint_tiles(\n\t\tcity_object\n\t)\n\tvar object_id := int(city_object.get("id", -1))\n\tvar footprint_hash_value := int(hash(footprint_tiles))\n\tvar cache := get_current_state().object_access_tile_cache\n\n\tif object_id > 0:\n\t\tvar raw_cache_entry = cache.get(object_id, {})\n\t\tif raw_cache_entry is Dictionary:\n\t\t\tvar cache_entry: Dictionary = raw_cache_entry\n\t\t\tif (\n\t\t\t\tint(cache_entry.get("world_instance_id", -1))\n\t\t\t\t== int(city_world.get_instance_id())\n\t\t\t\tand int(cache_entry.get("tile_data_version", -1))\n\t\t\t\t== city_world.tile_data_version\n\t\t\t\tand int(cache_entry.get("city_object_version", -1))\n\t\t\t\t== CityObjectSystem.get_city_object_version()\n\t\t\t\tand int(cache_entry.get("footprint_hash", -1))\n\t\t\t\t== footprint_hash_value\n\t\t\t):\n\t\t\t\tvar raw_cached_tiles = cache_entry.get("access_tiles", [])\n\t\t\t\tif raw_cached_tiles is Array:\n\t\t\t\t\treturn raw_cached_tiles.duplicate()\n\n\tvar footprint_lookup: Dictionary = {}\n\tfor raw_footprint_tile in footprint_tiles:\n\t\tif raw_footprint_tile is Vector2i:\n\t\t\tfootprint_lookup[raw_footprint_tile] = true\n\n\tvar access_tile_lookup: Dictionary = {}\n\tfor raw_footprint_tile in footprint_tiles:\n\t\tif not raw_footprint_tile is Vector2i:\n\t\t\tcontinue\n\t\tvar footprint_tile: Vector2i = raw_footprint_tile\n\t\tfor offset in WorldData.CITY_CARDINAL_TILE_OFFSETS:\n\t\t\tvar candidate_tile := footprint_tile + offset\n\t\t\tif footprint_lookup.has(candidate_tile):\n\t\t\t\tcontinue\n\t\t\tif access_tile_lookup.has(candidate_tile):\n\t\t\t\tcontinue\n\t\t\tif not is_city_tile_walkable_for_citizen(city_world, candidate_tile):\n\t\t\t\tcontinue\n\t\t\taccess_tile_lookup[candidate_tile] = true\n\t\t\taccess_tiles.append(candidate_tile)\n\n\taccess_tiles.sort_custom(_sort_city_tiles_y_then_x)\n\n\tif object_id > 0:\n\t\tcache[object_id] = {\n\t\t\t"world_instance_id": int(city_world.get_instance_id()),\n\t\t\t"tile_data_version": city_world.tile_data_version,\n\t\t\t"city_object_version": CityObjectSystem.get_city_object_version(),\n\t\t\t"footprint_hash": footprint_hash_value,\n\t\t\t"access_tiles": access_tiles.duplicate(),\n\t\t}\n\n\treturn access_tiles\n\n\n'''
          text = text.replace(insertion_point, block + insertion_point, 1)
          write(path, text)

          # WorldData loses physical navigation-cache ownership and its behavior
          # facade. Starting population keeps using the focused system.
          path = 'scripts/world/simulation/WorldData.gd'
          text = read(path)
          text = text.replace(
              '# Navigation access-tile caching is the remaining city-local compatibility\n# projection still owned by WorldData after Pass 10.\nstatic var city_object_access_tile_cache: Dictionary = {}\n\n',
              ''
          )
          text = text.replace(
              '\tcity_object_access_tile_cache.clear()\n',
              '\tCityNavigationSystem.reset_city_navigation_state()\n'
          )
          pattern = re.compile(
              r'\nstatic func _sort_city_tiles_y_then_x\(.*?\nstatic func get_starting_city_citizen_spawn_tiles\(',
              re.S,
          )
          match = pattern.search(text)
          assert match, 'WorldData access-tile block not found'
          text = text[:match.start()] + '\nstatic func get_starting_city_citizen_spawn_tiles(' + text[match.end():]
          text = text.replace(
              '\t\treturn get_city_object_access_tiles(\n',
              '\t\treturn CityNavigationSystem.get_city_object_access_tiles(\n'
          )
          write(path, text)

          # Every external caller now uses the focused behavioral owner.
          for gd_path in root.glob('scripts/**/*.gd'):
              text = gd_path.read_text(encoding='utf-8')
              updated = text.replace(
                  'WorldData.get_city_object_access_tiles',
                  'CityNavigationSystem.get_city_object_access_tiles',
              )
              if updated != text:
                  gd_path.write_text(updated, encoding='utf-8')

          # Permanent audit guard for the extracted navigation cache boundary.
          path = 'ci/audit_gdscript.py'
          text = read(path)
          marker = 'WORLD_DATA_FORBIDDEN_CITY_OBJECT_SYMBOLS = (\n'
          assert marker in text
          block = '''WORLD_DATA_FORBIDDEN_CITY_NAVIGATION_SYMBOLS = (\n    "city_object_access_tile_cache",\n    "get_city_object_access_tiles",\n    "_sort_city_tiles_y_then_x",\n)\n\n'''
          text = text.replace(marker, block + marker, 1)
          insert = '''\n        for symbol in WORLD_DATA_FORBIDDEN_CITY_NAVIGATION_SYMBOLS:\n            declaration_patterns = (\n                rf"^\\s*static\\s+var\\s+{re.escape(symbol)}\\b",\n                rf"^\\s*(?:static\\s+)?func\\s+{re.escape(symbol)}\\s*\\(",\n            )\n            if any(\n                re.search(pattern, world_data_text, re.MULTILINE)\n                for pattern in declaration_patterns\n            ):\n                errors.append(\n                    "scripts/world/simulation/WorldData.gd: extracted city-navigation "\n                    f"cache/behavior must not return to WorldData: {symbol}"\n                )\n\n'''
          anchor = '        settlement_state_path = (\n'
          assert anchor in text
          text = text.replace(anchor, insert + anchor, 1)
          anchor = '        for symbol in WORLD_DATA_FORBIDDEN_CITY_WORK_SYMBOLS:\n'
          external_guard = '''        for path in scripts:\n            if path == world_data_path:\n                continue\n            relative = str(path.relative_to(ROOT))\n            source_text = path.read_text(encoding="utf-8")\n            for symbol in WORLD_DATA_FORBIDDEN_CITY_NAVIGATION_SYMBOLS:\n                legacy_pattern = rf"WorldData\\s*\\.\\s*{re.escape(symbol)}\\b"\n                if re.search(legacy_pattern, source_text):\n                    errors.append(\n                        f"{relative}: legacy WorldData city-navigation reference remains: "\n                        f"WorldData.{symbol}"\n                    )\n\n'''
          assert anchor in text
          text = text.replace(anchor, external_guard + anchor, 1)
          write(path, text)
          PY

      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts ci/audit_gdscript.py
          if git diff --cached --quiet; then
            echo "No refactor changes to commit."
            exit 0
          fi
          git commit -m "Pass 11: extract navigation access cache ownership"
          git push origin HEAD:agent/pass11-worlddata-audit
