name: Export PR 8 Source Temporary

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export-source:
    if: github.head_ref == 'refactor/city-systems-explicit-state-only-redo'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Package exact source and Git history
        shell: bash
        run: |
          set -euo pipefail
          git bundle create paladin-pr8-exact.bundle HEAD
          tar \
            --exclude=.git \
            --exclude=.godot \
            --exclude=paladin-pr8-exact.bundle \
            --exclude=paladin-pr8-exact-source.tar.gz \
            -czf paladin-pr8-exact-source.tar.gz .

      - name: Upload exact PR 8 source
        uses: actions/upload-artifact@v4
        with:
          name: paladin-pr8-exact-source
          path: |
            paladin-pr8-exact.bundle
            paladin-pr8-exact-source.tar.gz
          if-no-files-found: error
          retention-days: 1
