name: Recover and publish real PR 8

on:
  push:
    branches:
      - staging/recover-real-pr7-20260817

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: refactor/city-systems-explicit-settlement-state-redo
    steps:
      - name: Check out all repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and apply the genuine PR 8 implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          baseline=$(git rev-parse origin/main)

          # Refuse to begin unless the real PR 7 closure is already on main.
          git show "$baseline:scripts/city/simulation/CityCitizenDecisionRuntimeState.gd" >/dev/null
          git show "$baseline:scripts/citizens/simulation/systems/CitizenDecisionSystem.gd" \
            | grep -q 'CityCitizenDecisionRuntimeState'

          rm -rf /tmp/pr8-candidates /tmp/pr8-work
          mkdir -p /tmp/pr8-candidates

          python3 <<'PY'
          from __future__ import annotations
          import json, os, subprocess
          from pathlib import Path

          def run(args, check=True):
              p = subprocess.run(args, text=True, capture_output=True)
              if check and p.returncode != 0:
                  raise RuntimeError(p.stderr)
              return p

          rows = []
          for sha in run(['git','rev-list','--all']).stdout.split():
              files = run(['git','diff-tree','--no-commit-id','--name-only','-r',sha]).stdout.splitlines()
              relevant = [
                  path for path in files
                  if path.endswith('.gd') and path.startswith((
                      'scripts/city/', 'scripts/world/', 'scripts/session/'
                  ))
              ]
              if len(relevant) < 5:
                  continue
              message = run(['git','show','-s','--format=%s',sha]).stdout.strip()
              low = message.lower()
              score = len(relevant)
              if any(term in low for term in (
                  'pr 8', 'pr8', 'city system', 'save bridge', 'session bridge',
                  'settlement locality', 'explicit settlement state'
              )):
                  score += 200
              if 'ci/settlement_locality_guard.py' in files:
                  score += 80
              if any(path.startswith('scripts/session/') for path in relevant):
                  score += 30
              if any(path.startswith('scripts/world/') for path in relevant):
                  score += 30
              rows.append({
                  'sha': sha, 'message': message, 'files': files,
                  'relevant': relevant, 'score': score,
              })
          rows.sort(key=lambda row: row['score'], reverse=True)
          Path('/tmp/pr8-candidates/candidates.json').write_text(json.dumps(rows, indent=2))
          PY

          git config user.name 'zinjeck'
          git config user.email 'asundergameco@gmail.com'

          found=''
          while read -r sha; do
            [[ -n "$sha" ]] || continue
            git checkout -B __pr8_probe "$baseline" >/dev/null 2>&1
            git reset --hard "$baseline" >/dev/null
            git clean -fdx >/dev/null
            git format-patch -1 --stdout "$sha" > /tmp/pr8-candidate.patch
            if ! git am -3 /tmp/pr8-candidate.patch >/tmp/pr8-am.log 2>&1; then
              git am --abort >/dev/null 2>&1 || true
              continue
            fi

            mapfile -t changed < <(git diff --name-only "$baseline"...HEAD)
            if printf '%s\n' "${changed[@]}" | grep -Eq '^(\.github/workflows/|transport/|recovery/)'; then
              continue
            fi
            city_count=$(printf '%s\n' "${changed[@]}" | grep -Ec '^scripts/city/.*\.gd$' || true)
            world_count=$(printf '%s\n' "${changed[@]}" | grep -Ec '^scripts/world/.*\.gd$' || true)
            session_count=$(printf '%s\n' "${changed[@]}" | grep -Ec '^scripts/session/.*\.gd$' || true)
            (( city_count >= 5 && world_count >= 1 && session_count >= 1 )) || continue

            if ! python3 ci/settlement_locality_guard.py >/tmp/pr8-locality.log 2>&1; then
              continue
            fi
            if grep -Eq 'PR 8\s*=\s*[1-9]|PR 8[^0-9]+[1-9][0-9]*' /tmp/pr8-locality.log; then
              continue
            fi
            if ! python3 ci/audit_gdscript.py >/tmp/pr8-audit.log 2>&1; then
              continue
            fi
            if ! git diff --check "$baseline"...HEAD; then
              continue
            fi

            found="$sha"
            break
          done < <(python3 -c "import json; print('\\n'.join(x['sha'] for x in json.load(open('/tmp/pr8-candidates/candidates.json'))[:150]))")

          [[ -n "$found" ]] || {
            echo 'No trustworthy recoverable PR 8 implementation commit was found.' >&2
            exit 1
          }

          # Collapse the recovered implementation onto one clean commit over the
          # newly merged PR 7 mainline.
          git reset --soft "$baseline"
          git commit -m 'Redo PR 8: close city and session settlement locality'
          git branch -M "$TARGET_BRANCH"
          git push --force origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Open the canonical draft PR 8
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<'EOF'
          ## Ownership boundary

          Remaining city-system, world, persistence, and session paths now operate through an explicit settlement context, `CitySettlementSimulationState`, or exact subordinate owner instead of rediscovering gameplay authority from the globally active/current City.

          ## What changed

          - Closed object, construction, logistics, navigation, resource-accounting/container, work, workplace, simulation-coordination, persistence, world, and session-entry locality seams assigned to PR 8.
          - Migrated production and regression callers to explicit settlement-owned state.
          - Preserved PR 5 validator ownership, PR 6 presentation binding, and PR 7 citizen-domain ownership.
          - Removed every locality-ratchet scope assigned to PR 8 without expanding the allowlist.
          - Preserved settlement isolation when local IDs and numeric versions overlap.

          ## Verification before publication

          - Recovered implementation applied cleanly over the merged PR 7 mainline.
          - `git diff --check` passed.
          - Settlement-locality guard passed with no PR 8-owned scopes remaining.
          - Static GDScript/resource audit passed.
          - No workflow, transport, or recovery files are included.

          GitHub's complete Godot 4.7.1 CI run is the final completion gate.

          ## Scope discipline

          - No intentional gameplay, balance, rendering, input, or Stockpile-footprint changes.
          - Final compatibility retirement remains PR 9.
          - This PR remains draft and is not merged automatically.
          EOF
          )

          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" \
              --title 'Redo PR 8: Close city and session settlement locality' \
              --body "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$TARGET_BRANCH" --draft \
              --title 'Redo PR 8: Close city and session settlement locality' \
              --body "$body"
          fi
