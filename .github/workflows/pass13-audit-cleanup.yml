name: Pass 13 Audit Cleanup
on:
  push:
    branches: [agent/pass13-remove-legacy-city-backend]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass13-remove-legacy-city-backend
      - name: Update architecture audit for post-legacy invariant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('ci/audit_gdscript.py')
          t=p.read_text(encoding='utf-8')
          # Resource accounting no longer needs a second legacy-conversion assignment.
          t=t.replace('            "city_state.resource_accounting_state =",\n','')
          # Registry/spatial/movement/task audits used to require both founding and
          # legacy-conversion adoption. Pass 13 intentionally removes the latter.
          t=re.sub(r'\n\s*\(\n\s*"legacy adoption",\n\s*r"\^\\s\*city_state\\\.[^\n]+\n\s*\),', '', t)
          for cls,label in [
              ('CityCitizenRegistryStateScript','registry'),
              ('CityCitizenSpatialStateScript','spatial'),
              ('CityCitizenMovementRuntimeStateScript','movement-runtime'),
              ('CityCitizenTaskRuntimeStateScript','task-runtime'),
          ]:
              t=t.replace(f'political_state_text.count("{cls}.new()") < 3', f'political_state_text.count("{cls}.new()") < 2')
          t=t.replace('fallback must be created initially, on reset, and "\n                "after legacy adoption"','fallback must be created initially and on reset"')
          p.write_text(t,encoding='utf-8')
          PY
      - name: Commit audit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/audit_gdscript.py
          git commit -m "Pass 13: update audit for single city backend"
          git push origin HEAD:agent/pass13-remove-legacy-city-backend
