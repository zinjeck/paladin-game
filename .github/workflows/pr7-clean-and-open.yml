name: PR7 branch cleanup
on:
  push:
    branches:
      - refactor/citizen-systems-explicit-settlement-state
permissions:
  contents: write
  pull-requests: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary probe commits if implementation is present
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target=$(git log --format='%H' --grep='^Close citizen systems over explicit settlement state$' -1)
          if [[ -z "$target" ]]; then
            echo 'Implementation commit is not present on the branch.' >&2
            exit 1
          fi
          git push --force origin "$target:refs/heads/refactor/citizen-systems-explicit-settlement-state"
