name: One-shot food matcher patch

on:
  push:
    branches:
      - feature/food-allocation-and-safe-popups

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/food-allocation-and-safe-popups

      - name: Cap each survival reservation to one physical item
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/city/simulation/systems/CityResourceMatcher.gd')
          text = path.read_text(encoding='utf-8')
          old = '''\t\trequested_amount = mini(
          \t\t\tavailable_amount,
          \t\t\tmini(
          \t\t\t\tavailable_capacity,
          \t\t\t\tceili(float(desired_nutrition) / float(hunger_restore))
          \t\t\t)
          \t\t)
          \t\tbreak
          '''
          new = '''\t\trequested_amount = mini(
          \t\t\tavailable_amount,
          \t\t\tmini(
          \t\t\t\tavailable_capacity,
          \t\t\t\tceili(float(desired_nutrition) / float(hunger_restore))
          \t\t\t)
          \t\t)
          \t\t# Shared survival food is allocated one physical item at a time.
          \t\t# The citizen must re-enter the hunger queue after that item, so
          \t\t# nearby citizens cannot reserve a private multi-meal bundle while
          \t\t# equally or more hungry citizens are still waiting.
          \t\trequested_amount = mini(requested_amount, 1)
          \t\tbreak
          '''

          if text.count(old) != 1:
              raise SystemExit('Expected survival reservation block was not found exactly once.')

          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/one-shot-food-matcher-patch.yml').unlink()
          PY

      - name: Commit the production patch and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/city/simulation/systems/CityResourceMatcher.gd
          git add .github/workflows/one-shot-food-matcher-patch.yml
          git commit -m "Allocate survival reservations one item at a time"
          git push origin HEAD:feature/food-allocation-and-safe-popups
