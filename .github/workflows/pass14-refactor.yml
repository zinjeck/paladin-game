name: Pass 14 Refactor
on:
  push:
    branches: [agent/pass14-worlddata-final-boundary]
permissions:
  contents: write
jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass14-worlddata-final-boundary
          fetch-depth: 0
      - name: Reduce WorldData to world-level responsibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          world_path = ROOT / 'scripts/world/simulation/WorldData.gd'
          world = world_path.read_text(encoding='utf-8')

          def extract_func(text, name):
              pat = re.compile(rf'^(?:static\s+)?func\s+{re.escape(name)}\s*\(', re.M)
              m = pat.search(text)
              assert m, f'missing function {name}'
              start = m.start()
              nxt = re.search(r'^(?:static\s+)?func\s+[A-Za-z_][A-Za-z0-9_]*\s*\(', text[m.end():], re.M)
              if nxt:
                  end = m.end() + nxt.start()
              else:
                  # stop at region/endregion when function is last in section
                  reg = re.search(r'^#(?:end)?region\b', text[m.end():], re.M)
                  end = m.end() + reg.start() if reg else len(text)
              return text[start:end].rstrip() + '\n\n'

          def remove_func(text, name):
              block = extract_func(text, name)
              assert block.rstrip() in text
              return text.replace(block.rstrip(), '', 1)

          # --- Add focused owner APIs -------------------------------------------------
          catalog_path = ROOT / 'scripts/city/data/CityObjectCatalog.gd'
          catalog = catalog_path.read_text(encoding='utf-8')
          catalog_helpers = '''\n\nstatic func get_city_object_resident_capacity(city_object: Dictionary) -> int:\n\tif city_object.is_empty():\n\t\treturn 0\n\tif city_object.has("resident_capacity"):\n\t\treturn int(city_object.get("resident_capacity", 0))\n\tvar definition := get_city_object_definition_from_object(city_object)\n\treturn int(definition.get("resident_capacity", 0))\n\n\nstatic func city_object_is_workplace(city_object: Dictionary) -> bool:\n\tif city_object.is_empty():\n\t\treturn false\n\tif bool(city_object.get("is_workplace", false)):\n\t\treturn true\n\tvar definition := get_city_object_definition_from_object(city_object)\n\treturn not definition.is_empty() and bool(definition.get("is_workplace", false))\n\n\nstatic func get_city_object_worker_capacity(city_object: Dictionary) -> int:\n\tif city_object.is_empty():\n\t\treturn 0\n\tif city_object.has("worker_capacity"):\n\t\treturn int(city_object.get("worker_capacity", 0))\n\tvar definition := get_city_object_definition_from_object(city_object)\n\treturn int(definition.get("worker_capacity", 0))\n\n\nstatic func get_city_object_output_resource(city_object: Dictionary) -> String:\n\tvar output_resources := get_city_object_output_resources(city_object)\n\tif not output_resources.is_empty():\n\t\treturn output_resources[0]\n\tif city_object.is_empty():\n\t\treturn CityResourceCatalogScript.RESOURCE_NONE\n\tif city_object.has("output_resource"):\n\t\treturn str(city_object.get("output_resource", CityResourceCatalogScript.RESOURCE_NONE))\n\tvar definition := get_city_object_definition_from_object(city_object)\n\treturn str(definition.get("output_resource", CityResourceCatalogScript.RESOURCE_NONE))\n\n\nstatic func get_city_object_output_resources(city_object: Dictionary) -> Array[String]:\n\treturn _get_recipe_output_resource_types(get_city_object_production_recipe(city_object))\n'''
          if 'static func get_city_object_resident_capacity(' not in catalog:
              catalog = catalog.rstrip() + catalog_helpers + '\n'
          catalog_path.write_text(catalog, encoding='utf-8')

          # CityObjectSystem owns context-sensitive placement eligibility/topology outcomes.
          object_path = ROOT / 'scripts/city/simulation/systems/CityObjectSystem.gd'
          obj = object_path.read_text(encoding='utf-8')
          topo_consts = '''\nconst CITY_TOPOLOGY_MUTATION_FAILURE_NONE := "none"\nconst CITY_TOPOLOGY_MUTATION_FAILURE_INVALID_REQUEST := "invalid_request"\nconst CITY_TOPOLOGY_MUTATION_FAILURE_TILE_BLOCKED := "tile_blocked"\nconst CITY_TOPOLOGY_MUTATION_FAILURE_FOOTPRINT_OCCUPIED := "footprint_occupied"\n'''
          if 'const CITY_TOPOLOGY_MUTATION_FAILURE_NONE' not in obj:
              insert_at = obj.find('\n', obj.find('class_name CityObjectSystem')) + 1
              obj = obj[:insert_at] + topo_consts + obj[insert_at:]
          can_use = extract_func(world, 'can_use_city_object_definition')
          can_use = can_use.replace('get_city_object_definition(object_type)', 'CityObjectCatalog.get_city_object_definition(object_type)')
          can_use = can_use.replace('can_build_in_city()', 'WorldData.can_build_in_city()')
          can_use = can_use.replace('has_player_city()', 'WorldData.has_player_city()')
          if 'static func can_use_city_object_definition(' not in obj:
              obj = obj.rstrip() + '\n\n' + can_use
          object_path.write_text(obj, encoding='utf-8')

          # Navigation owns the shared cardinal city-neighbor offsets.
          nav_path = ROOT / 'scripts/city/simulation/systems/CityNavigationSystem.gd'
          nav = nav_path.read_text(encoding='utf-8')
          if 'const CITY_CARDINAL_TILE_OFFSETS' not in nav:
              marker = 'class_name CityNavigationSystem\n'
              nav = nav.replace(marker, marker + '\nconst CITY_CARDINAL_TILE_OFFSETS := [\n\tVector2i(0, -1),\n\tVector2i(-1, 0),\n\tVector2i(1, 0),\n\tVector2i(0, 1),\n]\n', 1)
          nav_path.write_text(nav, encoding='utf-8')

          # Production mutation belongs with workplace production behavior.
          prod_path = ROOT / 'scripts/city/simulation/systems/WorkplaceProductionSystem.gd'
          prod = prod_path.read_text(encoding='utf-8')
          prod_func = extract_func(world, 'set_city_workplace_production_state')
          prod_func = prod_func.replace('CITY_WORKPLACE_PRODUCTION_STATE_KEYS', 'CityObjectCatalog.CITY_WORKPLACE_PRODUCTION_STATE_KEYS')
          prod_func = prod_func.replace('get_city_object_production_recipe(', 'CityObjectCatalog.get_city_object_production_recipe(')
          prod_func = prod_func.replace('get_city_object_production_progress_work_units(', 'CityObjectCatalog.get_city_object_production_progress_work_units(')
          prod_func = prod_func.replace('get_city_object_production_status(', 'CityObjectCatalog.get_city_object_production_status(')
          prod_func = prod_func.replace('get_city_object_productive_worker_count(', 'CityObjectCatalog.get_city_object_productive_worker_count(')
          prod_func = prod_func.replace('get_city_object_site_productivity_basis_points(', 'CityObjectCatalog.get_city_object_site_productivity_basis_points(')
          prod_func = prod_func.replace('is_valid_city_workplace_production_status(', 'CityObjectCatalog.is_valid_city_workplace_production_status(')
          prod_func = prod_func.replace('WORKPLACE_PRODUCTION_STATUS_INACTIVE', 'CityObjectCatalog.WORKPLACE_PRODUCTION_STATUS_INACTIVE')
          if 'static func set_city_workplace_production_state(' not in prod:
              prod = prod.rstrip() + '\n\n' + prod_func
          prod_path.write_text(prod, encoding='utf-8')

          # Logistics owns haul reservation lifecycle end-to-end.
          logistics_path = ROOT / 'scripts/city/simulation/systems/CityLogisticsSystem.gd'
          logistics = logistics_path.read_text(encoding='utf-8')
          logistics_names = [
              'commit_city_haul_source_reservation',
              'release_city_haul_destination_reservation',
              'retarget_city_haul_destination_reservation',
              'reserve_city_haul_destination',
              'commit_city_haul_destination_reservation',
          ]
          for name in logistics_names:
              if f'static func {name}(' in logistics:
                  continue
              block = extract_func(world, name)
              block = block.replace('CityCitizensScript.', 'CityCitizens.')
              block = block.replace('CONTAINER_HAUL_PURPOSE_NONE', 'CityObjectCatalog.CONTAINER_HAUL_PURPOSE_NONE')
              block = block.replace('RESOURCE_NONE', 'CityResourceCatalog.RESOURCE_NONE')
              block = block.replace('is_city_resource_type(', 'CityResourceCatalog.is_city_resource_type(')
              block = block.replace('reserve_city_haul_destination(', 'CityLogisticsSystem.reserve_city_haul_destination(')
              logistics = logistics.rstrip() + '\n\n' + block
          logistics_path.write_text(logistics, encoding='utf-8')

          # Citizen registry owns citizen creation/demographics/culture identity and reset lifecycle.
          registry_path = ROOT / 'scripts/citizens/simulation/systems/CityCitizenRegistrySystem.gd'
          registry = registry_path.read_text(encoding='utf-8')
          if 'const STARTING_CITY_POPULATION' not in registry:
              marker = 'class_name CityCitizenRegistrySystem\n'
              registry = registry.replace(marker, marker + '\nconst STARTING_CITY_POPULATION := 8\nconst STARTING_CITY_MALE_POPULATION: int = 4\nconst STARTING_CITY_FEMALE_POPULATION: int = 4\n', 1)
          registry_names = [
              'reset_city_citizen_state',
              'get_city_citizen_name_seed',
              'get_city_citizen_count_by_sex',
              'make_random_city_citizen_first_name',
              'resolve_city_citizen_culture_id',
              'make_city_citizen',
              'add_city_citizen',
              'initialize_starting_city_population',
              'ensure_city_citizen_demographic_state',
              'get_city_citizen_culture_id',
              'get_city_citizen_culture',
              'get_city_citizen_culture_name',
          ]
          for name in registry_names:
              if f'static func {name}(' in registry:
                  continue
              block = extract_func(world, name)
              block = block.replace('CityCitizensScript.', 'CityCitizens.')
              block = block.replace('INVALID_CITY_TILE_POSITION', 'CityCitizens.INVALID_CITY_TILE_POSITION')
              block = block.replace('CITY_CITIZEN_SEX_MALE', 'CityCitizens.CITY_CITIZEN_SEX_MALE')
              block = block.replace('CITY_CITIZEN_SEX_FEMALE', 'CityCitizens.CITY_CITIZEN_SEX_FEMALE')
              block = block.replace('INVALID_CULTURE_ID', 'WorldData.INVALID_CULTURE_ID')
              block = block.replace('city_start_world_seed', 'WorldData.city_start_world_seed')
              block = re.sub(r'(?<![\.A-Za-z0-9_])has_culture_id\(', 'WorldData.has_culture_id(', block)
              block = re.sub(r'(?<![\.A-Za-z0-9_])get_culture_by_id\(', 'WorldData.get_culture_by_id(', block)
              block = re.sub(r'(?<![\.A-Za-z0-9_])get_culture_name_by_id\(', 'WorldData.get_culture_name_by_id(', block)
              block = block.replace('not player_city_founded', 'not WorldData.player_city_founded')
              block = block.replace('get_starting_city_citizen_spawn_tiles(', 'CityCitizenSpatialSystem.get_starting_city_citizen_spawn_tiles(')
              registry = registry.rstrip() + '\n\n' + block
          registry_path.write_text(registry, encoding='utf-8')

          # Citizen spatial system owns Keep-based initial spawn resolution.
          spatial_path = ROOT / 'scripts/citizens/simulation/systems/CityCitizenSpatialSystem.gd'
          spatial = spatial_path.read_text(encoding='utf-8')
          spawn = extract_func(world, 'get_starting_city_citizen_spawn_tiles')
          spawn = spawn.replace('CITY_OBJECT_CITY_CENTER', 'CityObjectCatalog.CITY_OBJECT_CITY_CENTER')
          if 'static func get_starting_city_citizen_spawn_tiles(' not in spatial:
              spatial = spatial.rstrip() + '\n\n' + spawn
          spatial_path.write_text(spatial, encoding='utf-8')

          # --- Migrate callers --------------------------------------------------------
          citizen_const_names = [
              'CITY_CITIZEN_SEX_MALE','CITY_CITIZEN_SEX_FEMALE','CITY_CITIZEN_STATE_IDLE',
              'CITY_CITIZEN_TASK_KIND_NONE','CITY_CITIZEN_TASK_KIND_WORK','CITY_CITIZEN_TASK_KIND_HAUL',
              'CITY_CITIZEN_TASK_KIND_ACQUIRE_FOOD','CITY_CITIZEN_TASK_KIND_PLAYER_COMMAND',
              'CITY_CITIZEN_TASK_KIND_CONSTRUCTION','CITY_CITIZEN_TASK_KIND_RETURN_HOME',
              'CITY_CITIZEN_TASK_SOURCE_NONE','CITY_CITIZEN_TASK_SOURCE_PLAYER','CITY_CITIZEN_TASK_SOURCE_SCHEDULE','CITY_CITIZEN_TASK_SOURCE_AUTONOMY',
              'CITY_CITIZEN_TASK_PHASE_NONE','CITY_CITIZEN_TASK_PHASE_PENDING','CITY_CITIZEN_TASK_PHASE_TRAVELING','CITY_CITIZEN_TASK_PHASE_PERFORMING','CITY_CITIZEN_TASK_PHASE_BLOCKED','CITY_CITIZEN_TASK_PRIORITY_NONE',
              'INVALID_CITY_CITIZEN_TASK_START_WORLD_MINUTE','INVALID_CITY_CITIZEN_TASK_ACTION_WORLD_MINUTE',
              'CITY_CITIZEN_HAUL_ENDPOINT_KIND_NONE','CITY_CITIZEN_HAUL_ENDPOINT_KIND_CITY_OBJECT_CONTAINER','CITY_CITIZEN_HAUL_ENDPOINT_KIND_GROUND_PILE','CITY_CITIZEN_HAUL_ENDPOINT_KIND_GROUND_TILE','CITY_CITIZEN_HAUL_ENDPOINT_KIND_CONSTRUCTION_SITE',
              'CITY_CITIZEN_HAUL_REASON_NONE','CITY_CITIZEN_HAUL_REASON_WORKPLACE_OUTPUT_BEFORE_HOME','CITY_CITIZEN_HAUL_REASON_AUTONOMOUS_WORKPLACE_OUTPUT','CITY_CITIZEN_HAUL_REASON_GROUND_PILE_CLEANUP','CITY_CITIZEN_HAUL_REASON_SCHEDULED_HOME_FOOD_DELIVERY','CITY_CITIZEN_HAUL_REASON_AUTONOMOUS_HOME_FOOD_DELIVERY','CITY_CITIZEN_HAUL_REASON_OUTSTANDING_CARGO','CITY_CITIZEN_HAUL_REASON_CONSTRUCTION_DELIVERY',
              'INVALID_CITY_CITIZEN_HAUL_RESERVATION_ID','CITY_CITIZEN_HAUL_PHASE_NONE','CITY_CITIZEN_HAUL_PHASE_PENDING_SOURCE','CITY_CITIZEN_HAUL_PHASE_TRAVELING_TO_SOURCE','CITY_CITIZEN_HAUL_PHASE_PICKING_UP','CITY_CITIZEN_HAUL_PHASE_PENDING_DESTINATION','CITY_CITIZEN_HAUL_PHASE_TRAVELING_TO_DESTINATION','CITY_CITIZEN_HAUL_PHASE_DEPOSITING','CITY_CITIZEN_HAUL_PHASE_RETARGETING','CITY_CITIZEN_HAUL_PHASE_BLOCKED',
              'INVALID_CITY_TILE_POSITION','CITY_CITIZEN_MOVEMENT_STATE_IDLE','CITY_CITIZEN_MOVEMENT_STATE_MOVING','CITY_CITIZEN_MOVEMENT_STATE_BLOCKED','CITY_CITIZEN_MOVEMENT_FAILURE_NONE','CITY_CITIZEN_MOVEMENT_FAILURE_INVALID_PATH','CITY_CITIZEN_MOVEMENT_FAILURE_NEXT_TILE_BLOCKED','CITY_CITIZEN_MOVEMENT_FAILURE_REPATH_FAILED','CITY_CITIZEN_CARDINAL_MOVEMENT_COST','CITY_CITIZEN_DIAGONAL_MOVEMENT_COST','CITY_ROAD_MOVEMENT_SPEED_MULTIPLIER','CITY_CITIZEN_ROAD_CARDINAL_MOVEMENT_COST','CITY_CITIZEN_ROAD_DIAGONAL_MOVEMENT_COST','CITY_CITIZEN_MOVEMENT_PROGRESS_PER_TILE','DEFAULT_CITIZEN_MOVEMENT_SPEED_PER_MINUTE','MAX_CITIZEN_MOVEMENT_REPATH_ATTEMPTS',
          ]
          object_const_names = [
              'CITY_OBJECT_CITY_CENTER','CITY_OBJECT_HOUSE','CITY_OBJECT_STOCKPILE','CITY_OBJECT_FISHING_GROUNDS','CITY_OBJECT_PLACEHOLDER_BUILDING','CITY_OBJECT_ROAD','CITY_OBJECT_PLACEMENT_EFFECT_NONE','CITY_OBJECT_PLACEMENT_EFFECT_FOUND_CITY','CITY_OBJECT_SHAPE_RECTANGLE','CITY_OBJECT_SHAPE_TILE_AREA','WORKPLACE_KIND_NONE','WORKPLACE_KIND_GATHERING','WORKPLACE_ANCHOR_MODE_FOOTPRINT_CENTER','WORKPLACE_ANCHOR_MODE_EXPLICIT_POINT','WORKPLACE_ANCHOR_MODE_EXPLICIT_TILE','WORKPLACE_RESOURCE_SOURCE_MODE_NONE','WORKPLACE_RESOURCE_SOURCE_MODE_RADIUS','WORKPLACE_RESOURCE_SOURCE_MODE_FOOTPRINT_REACH','WORKPLACE_RESOURCE_SOURCE_MODE_LINKED_TILES','WORKPLACE_RESOURCE_SOURCE_MODE_LINKED_OBJECTS','WORKPLACE_RESOURCE_SOURCE_MODE_STORED_INPUTS','WORKPLACE_RESOURCE_SOURCE_MODE_EXPLICIT_WORK_POINTS','WORKPLACE_WORK_LOCATION_MODE_NONE','WORKPLACE_WORK_LOCATION_MODE_RESOURCE_SOURCE_TILES','WORKPLACE_WORK_LOCATION_MODE_LINKED_TILES','WORKPLACE_WORK_LOCATION_MODE_WORKSTATIONS','WORKPLACE_WORK_LOCATION_MODE_EXPLICIT_POINTS','WORKPLACE_WORK_LOCATION_MODE_FOOTPRINT','WORKPLACE_WORK_LOCATION_ZONE_SOURCE_RESOURCE_SOURCE','WORKPLACE_WORK_LOCATION_TILE_REQUIREMENT_WALKABLE','WORKPLACE_WORK_LOCATION_ADJACENCY_NONE','WORKPLACE_WORK_LOCATION_ADJACENCY_CARDINAL_TERRAIN','WORKPLACE_MOVEMENT_MODE_NONE','WORKPLACE_MOVEMENT_MODE_MOVE_BETWEEN_WORK_POINTS','WORKPLACE_MOVEMENT_MODE_STATION_BASED','WORKPLACE_MOVEMENT_MODE_REMAIN_AT_STATION','WORKPLACE_MOVEMENT_MODE_LINKED_TILE_TASKS','WORKPLACE_BREAK_LOCATION_MODE_NONE','WORKPLACE_BREAK_LOCATION_MODE_FOOTPRINT','WORKPLACE_BREAK_LOCATION_MODE_FOOTPRINT_RADIUS','WORKPLACE_BREAK_LOCATION_MODE_LINKED_AREA','WORKPLACE_BREAK_LOCATION_MODE_EXPLICIT_TILES','WORKPLACE_BREAK_LOCATION_MODE_WORK_AREA','WORKPLACE_BREAK_LOCATION_MODE_INTERIOR','WORKPLACE_OVERFLOW_MODE_NONE','WORKPLACE_OVERFLOW_MODE_FOOTPRINT_RADIUS','WORKPLACE_OVERFLOW_MODE_EXPLICIT_TILES','WORKPLACE_OVERFLOW_MODE_LINKED_AREA','PRODUCTIVITY_BASIS_POINTS_SCALE','DEFAULT_WORKPLACE_SITE_PRODUCTIVITY_BASIS_POINTS','WORKPLACE_PRODUCTION_STATUS_INACTIVE','WORKPLACE_PRODUCTION_STATUS_IDLE_NO_WORKERS','WORKPLACE_PRODUCTION_STATUS_WORKING','WORKPLACE_PRODUCTION_STATUS_BLOCKED_OUTPUT_FULL','WORKPLACE_PRODUCTION_STATUS_BLOCKED_MISSING_INPUT','WORKPLACE_PRODUCTION_STATUS_BLOCKED_NO_RESOURCE_SOURCE','CITY_WORKPLACE_PRODUCTION_STATE_KEYS','CONTAINER_TYPE_NONE','CONTAINER_TYPE_PUBLIC_CITY_STORAGE','CONTAINER_TYPE_PRIVATE_HOME_STORAGE','CONTAINER_TYPE_WORKPLACE_STORAGE','CONTAINER_TYPE_PERSONAL_INVENTORY','CONTAINER_TYPE_GROUND_PILE','CONTAINER_ACCESS_COUNTS_TOWARD_CITY_OWNED_TOTALS','CONTAINER_ACCESS_PUBLICLY_USABLE','CONTAINER_ACCESS_HAUL_DEPOSIT_PURPOSES','CONTAINER_ACCESS_HAUL_WITHDRAWAL_PURPOSES','CONTAINER_ACCESS_DIRECT_WITHDRAWAL_PURPOSES','CONTAINER_HAUL_PURPOSE_NONE','CONTAINER_HAUL_PURPOSE_PUBLIC_STORAGE','CONTAINER_HAUL_PURPOSE_HOME_DELIVERY','CONTAINER_HAUL_PURPOSE_WORKPLACE_OUTPUT','CONTAINER_HAUL_PURPOSE_GROUND_PILE_CLEANUP','CONTAINER_HAUL_PURPOSE_CONSTRUCTION','CONTAINER_HAUL_PURPOSE_HOUSEHOLD_FOOD_SOURCE','CONTAINER_DIRECT_WITHDRAWAL_PURPOSE_NONE','CONTAINER_DIRECT_WITHDRAWAL_PURPOSE_PERSONAL_FOOD','PUBLIC_CITY_STORAGE_TIER_NONE','PUBLIC_CITY_STORAGE_TIER_STOCKPILE','PUBLIC_CITY_STORAGE_TIER_CITY_KEEP','CITY_OBJECT_INTERIOR_ACCESS_NONE','CITY_OBJECT_INTERIOR_ACCESS_RESIDENTS','CITY_OBJECT_INTERIOR_ACCESS_ASSIGNED_WORKERS','CITY_OBJECT_INTERIOR_ACCESS_TASK_TARGET','CITY_OBJECT_INTERIOR_ACCESS_PUBLIC','CITY_OBJECT_ENTRY_MODE_ANY_BOUNDARY','CITY_OBJECT_ENTRY_MODE_EXPLICIT_TILES',
          ]
          catalog_funcs = [
              'ensure_city_object_definitions_ready','setup_city_object_definitions','make_city_object_definition','get_city_object_definition','get_city_object_definition_from_object','get_city_object_production_recipe','get_city_object_resource_source_policy','get_city_object_work_location_policy','get_city_object_work_movement_policy','get_city_object_break_location_policy','get_city_object_overflow_policy','get_city_object_production_progress_work_units','get_city_object_production_status','get_city_object_productive_worker_count','get_city_object_site_productivity_basis_points','is_valid_workplace_anchor_mode','is_valid_workplace_resource_source_mode','is_valid_workplace_work_location_mode','is_valid_workplace_movement_mode','is_valid_workplace_break_location_mode','is_valid_workplace_overflow_mode','is_valid_city_workplace_production_status','get_city_object_display_name_for_type','get_city_object_size_for_type','get_city_object_visual_style_for_type','get_city_object_resident_capacity','city_object_is_workplace','get_city_object_worker_capacity','get_city_object_output_resource','get_city_object_output_resources',
          ]
          registry_funcs = ['reset_city_citizen_state','get_city_citizen_name_seed','get_city_citizen_count_by_sex','make_random_city_citizen_first_name','resolve_city_citizen_culture_id','make_city_citizen','add_city_citizen','initialize_starting_city_population','ensure_city_citizen_demographic_state','get_city_citizen_culture_id','get_city_citizen_culture','get_city_citizen_culture_name']

          for p in ROOT.joinpath('scripts').rglob('*.gd'):
              if p == world_path:
                  continue
              t = p.read_text(encoding='utf-8')
              for name in citizen_const_names:
                  t = t.replace(f'WorldData.{name}', f'CityCitizens.{name}')
              for name in object_const_names:
                  t = t.replace(f'WorldData.{name}', f'CityObjectCatalog.{name}')
              for name in catalog_funcs:
                  t = t.replace(f'WorldData.{name}', f'CityObjectCatalog.{name}')
              for name in registry_funcs:
                  t = t.replace(f'WorldData.{name}', f'CityCitizenRegistrySystem.{name}')
              for name in logistics_names:
                  t = t.replace(f'WorldData.{name}', f'CityLogisticsSystem.{name}')
              t = t.replace('WorldData.set_city_workplace_production_state', 'WorkplaceProductionSystem.set_city_workplace_production_state')
              t = t.replace('WorldData.can_use_city_object_definition', 'CityObjectSystem.can_use_city_object_definition')
              t = t.replace('WorldData.CITY_CARDINAL_TILE_OFFSETS', 'CityNavigationSystem.CITY_CARDINAL_TILE_OFFSETS')
              for name in ['CITY_TOPOLOGY_MUTATION_FAILURE_NONE','CITY_TOPOLOGY_MUTATION_FAILURE_INVALID_REQUEST','CITY_TOPOLOGY_MUTATION_FAILURE_TILE_BLOCKED','CITY_TOPOLOGY_MUTATION_FAILURE_FOOTPRINT_OCCUPIED']:
                  t = t.replace(f'WorldData.{name}', f'CityObjectSystem.{name}')
              t = t.replace('WorldData.get_city_resource_types()', 'CityResourceCatalog.get_city_resource_types()')
              t = t.replace('WorldData.is_city_resource_type(', 'CityResourceCatalog.is_city_resource_type(')
              t = t.replace('WorldData.get_starting_city_citizen_spawn_tiles(', 'CityCitizenSpatialSystem.get_starting_city_citizen_spawn_tiles(')
              for old,new in [('WorldData.STARTING_CITY_POPULATION','CityCitizenRegistrySystem.STARTING_CITY_POPULATION'),('WorldData.STARTING_CITY_MALE_POPULATION','CityCitizenRegistrySystem.STARTING_CITY_MALE_POPULATION'),('WorldData.STARTING_CITY_FEMALE_POPULATION','CityCitizenRegistrySystem.STARTING_CITY_FEMALE_POPULATION')]:
                  t=t.replace(old,new)
              p.write_text(t, encoding='utf-8')

          # --- Strip city-only aliases and behavior from WorldData -------------------
          world = world.replace('# File responsibility: Authoritative world and city state, mutation APIs, indexes, and session-level caches.\n# Navigation regions are organizational only; they do not define runtime ownership.\n', '# File responsibility: world/city grid data plus world/founding/session metadata and global visual-session coordination.\n# Settlement-local simulation state and behavior belong to focused city systems.\n')
          world = re.sub(r'const CityCitizensScript = preload\(\n\t"res://scripts/citizens/simulation/CityCitizens.gd"\n\)\n', '', world, count=1)
          world = re.sub(r'const CityObjectCatalogScript = preload\(\n\t"res://scripts/city/data/CityObjectCatalog.gd"\n\)\n', '', world, count=1)

          # Remove alias constant zone from STARTING_CITY_POPULATION through CITY_OBJECT_ENTRY_MODE_EXPLICIT_TILES.
          start = world.index('const STARTING_CITY_POPULATION')
          end_marker = 'const CITY_OBJECT_ENTRY_MODE_EXPLICIT_TILES := CityObjectCatalogScript.CITY_OBJECT_ENTRY_MODE_EXPLICIT_TILES\n'
          end = world.index(end_marker, start) + len(end_marker)
          world = world[:start] + world[end:]

          # Remove the now-redundant CityObjectCatalog wrapper section up to the grid region.
          cat_start = world.index('static func ensure_city_object_definitions_ready()')
          grid_marker = '#region World Grid and Tile State'
          cat_end = world.index(grid_marker, cat_start)
          world = world[:cat_start] + world[cat_end:]

          moved_names = logistics_names + registry_names + [
              'get_city_object_resident_capacity','city_object_is_workplace','get_city_object_worker_capacity','get_city_object_output_resource','get_city_object_output_resources','get_starting_city_citizen_spawn_tiles'
          ]
          for name in moved_names:
              if re.search(rf'^(?:static\s+)?func\s+{re.escape(name)}\s*\(', world, re.M):
                  world = remove_func(world, name)

          # Remove catalog resource-list wrappers; the catalog is the focused source.
          for name in ['get_city_resource_types','is_city_resource_type']:
              if re.search(rf'^static\s+func\s+{name}\s*\(', world, re.M):
                  world = remove_func(world, name)

          # Update remaining WorldData orchestration to call focused owners.
          world = world.replace('\tinitialize_starting_city_population()\n', '\tCityCitizenRegistrySystem.initialize_starting_city_population()\n')
          world = world.replace('\treset_city_citizen_state()\n', '\tCityCitizenRegistrySystem.reset_city_citizen_state()\n')
          world_path.write_text(world, encoding='utf-8')

          # Permanent audit: WorldData may not reacquire extracted city behavior/catalog aliases.
          audit_path = ROOT / 'ci/audit_gdscript.py'
          audit = audit_path.read_text(encoding='utf-8')
          anchor = 'WORLD_DATA_FORBIDDEN_CITY_NAVIGATION_SYMBOLS = ('
          guard_const = '''WORLD_DATA_FINAL_FORBIDDEN_CITY_SYMBOLS = (\n    "CityCitizensScript",\n    "CityObjectCatalogScript",\n    "STARTING_CITY_POPULATION",\n    "CITY_CITIZEN_TASK_KIND_NONE",\n    "CITY_CITIZEN_HAUL_ENDPOINT_KIND_NONE",\n    "INVALID_CITY_TILE_POSITION",\n    "CITY_OBJECT_CITY_CENTER",\n    "CONTAINER_TYPE_PUBLIC_CITY_STORAGE",\n    "WORKPLACE_PRODUCTION_STATUS_WORKING",\n    "CITY_CARDINAL_TILE_OFFSETS",\n    "CITY_TOPOLOGY_MUTATION_FAILURE_NONE",\n    "get_city_object_definition",\n    "get_city_object_resident_capacity",\n    "city_object_is_workplace",\n    "set_city_workplace_production_state",\n    "commit_city_haul_source_reservation",\n    "reserve_city_haul_destination",\n    "add_city_citizen",\n    "initialize_starting_city_population",\n    "ensure_city_citizen_demographic_state",\n    "get_starting_city_citizen_spawn_tiles",\n    "get_city_resource_types",\n    "is_city_resource_type",\n)\n\n'''
          if 'WORLD_DATA_FINAL_FORBIDDEN_CITY_SYMBOLS' not in audit:
              assert anchor in audit
              audit = audit.replace(anchor, guard_const + anchor, 1)
          main_anchor = '    if world_data_path.exists():\n        world_data_text = world_data_path.read_text(encoding="utf-8")\n'
          guard = '''    if world_data_path.exists():\n        world_data_text = world_data_path.read_text(encoding="utf-8")\n        for symbol in WORLD_DATA_FINAL_FORBIDDEN_CITY_SYMBOLS:\n            if re.search(rf"\\b{re.escape(symbol)}\\b", world_data_text):\n                errors.append(\n                    "scripts/world/simulation/WorldData.gd: Pass 14 final boundary "\n                    f"forbids city-only symbol: {symbol}"\n                )\n'''
          if 'Pass 14 final boundary forbids city-only symbol' not in audit:
              assert main_anchor in audit
              audit = audit.replace(main_anchor, guard, 1)
          audit_path.write_text(audit, encoding='utf-8')

          # Focused runtime boundary test exercises the relocated APIs.
          test_path = ROOT / 'scripts/city/simulation/CityWorldDataBoundaryTest.gd'
          test_path.write_text('''extends Node\n\nvar failure_count: int = 0\n\nfunc _ready() -> void:\n\tWorldData.reset_runtime_session_state()\n\t_test_catalog_boundary()\n\t_test_registry_boundary()\n\tWorldData.reset_runtime_session_state()\n\tif failure_count > 0:\n\t\tpush_error("WorldData boundary test failed: " + str(failure_count))\n\t\tget_tree().quit(1)\n\t\treturn\n\tprint("WorldData final boundary test passed.")\n\tget_tree().quit(0)\n\nfunc _test_catalog_boundary() -> void:\n\tvar house := CityObjectCatalog.get_city_object_definition(CityObjectCatalog.CITY_OBJECT_HOUSE)\n\t_expect(not house.is_empty(), "CityObjectCatalog must own object definitions.")\n\t_expect(CityObjectCatalog.get_city_object_size_for_type(CityObjectCatalog.CITY_OBJECT_HOUSE) == Vector2i(3, 3), "Object metadata must resolve outside WorldData.")\n\t_expect(CityObjectCatalog.get_city_object_resident_capacity({"type": CityObjectCatalog.CITY_OBJECT_HOUSE}) == 4, "Housing policy must resolve through CityObjectCatalog.")\n\nfunc _test_registry_boundary() -> void:\n\tvar culture := WorldData.create_culture("Pass 14 Culture")\n\t_expect(not culture.is_empty(), "World-level culture creation must remain available.")\n\tvar citizen := CityCitizenRegistrySystem.add_city_citizen("", Vector2i(1, 1), CityCitizens.CITY_CITIZEN_SEX_MALE, int(culture.get("id", -1)))\n\t_expect(not citizen.is_empty(), "Citizen creation must resolve through CityCitizenRegistrySystem.")\n\t_expect(CityCitizenRegistrySystem.get_city_population_count() == 1, "Citizen registry owner must receive the new citizen.")\n\nfunc _expect(condition: bool, message: String) -> void:\n\tif condition:\n\t\treturn\n\tfailure_count += 1\n\tpush_error("WorldData boundary test: " + message)\n''', encoding='utf-8')
          ROOT.joinpath('scripts/city/simulation/CityWorldDataBoundaryTest.tscn').write_text('''[gd_scene load_steps=2 format=3]\n\n[ext_resource path="res://scripts/city/simulation/CityWorldDataBoundaryTest.gd" type="Script" id="1"]\n\n[node name="CityWorldDataBoundaryTest" type="Node"]\nscript = ExtResource("1")\n''', encoding='utf-8')

          # Sanity assertions before commit.
          final_world = world_path.read_text(encoding='utf-8')
          for token in ['CityCitizensScript','CityObjectCatalogScript','static func add_city_citizen(','static func reserve_city_haul_destination(','static func get_city_object_definition(','const CITY_OBJECT_CITY_CENTER']:
              assert token not in final_world, token
          PY

