name: Apply independent map texture test

on:
  push:
    branches:
      - test/independent-map-textures

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: test/independent-map-textures
          fetch-depth: 0

      - name: Replace shared GPU atlas with independent mode textures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def replace_regex_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one regex match, found {count}")
              return updated

          cache_path = Path("scripts/map/cache/MapTextureCache.gd")
          cache = cache_path.read_text(encoding="utf-8")
          cache = replace_once(
              cache,
              "# Map modes are prepared atomically as one horizontal texture atlas. One tile\n"
              "# traversal computes every mode, one GPU upload publishes the atlas, and each\n"
              "# mode is an AtlasTexture view into that shared resource. No later frame warms\n"
              "# map modes and switching modes is always a cache-only texture swap.\n",
              "# Map modes are prepared atomically as one complete set of independent\n"
              "# ImageTextures. One tile traversal computes every mode, every GPU upload is\n"
              "# completed before publication, and switching modes remains a cache-only\n"
              "# texture swap. No later gameplay frame performs map-mode generation work.\n",
              "MapTextureCache header",
          )
          cache = replace_once(
              cache,
              "push_error(label + \" map texture atlas could not be prepared.\")",
              "push_error(label + \" map texture set could not be prepared.\")",
              "MapTextureCache rebuild error",
          )
          cache = replace_once(
              cache,
              "label + \" map atlas ready; active mode: \",",
              "label + \" independent map textures ready; active mode: \",",
              "MapTextureCache debug label",
          )
          cache = replace_once(
              cache,
              "var prepared_textures := _build_atomic_texture_atlas(\n",
              "var prepared_textures := _build_independent_mode_textures(\n",
              "MapTextureCache builder call",
          )

          independent_builder = '''func _build_independent_mode_textures(
\tsource_world: WorldData,
\tall_modes: Array[int]
) -> Dictionary:
\tvar mode_images: Array[Image] = []

\tfor _mode in all_modes:
\t\tmode_images.append(
\t\t\tImage.create(
\t\t\t\tsource_world.width,
\t\t\t\tsource_world.height,
\t\t\t\tfalse,
\t\t\t\tImage.FORMAT_RGBA8
\t\t\t)
\t\t)

\tvar reusable_colors: Array[Color] = []
\treusable_colors.resize(_get_mode_color_buffer_size(all_modes))
\tvar use_all_colors_provider := all_colors_provider.is_valid()

\tfor y in range(source_world.height):
\t\tvar row: Array = source_world.tiles[y]

\t\tfor x in range(source_world.width):
\t\t\tvar tile: Dictionary = row[x]

\t\t\tif use_all_colors_provider:
\t\t\t\tall_colors_provider.call(tile, reusable_colors)

\t\t\tfor mode_index in range(all_modes.size()):
\t\t\t\tvar mode_int := all_modes[mode_index]
\t\t\t\tvar tile_color := Color.MAGENTA

\t\t\t\tif (
\t\t\t\t\tuse_all_colors_provider
\t\t\t\t\tand mode_int >= 0
\t\t\t\t\tand mode_int < reusable_colors.size()
\t\t\t\t):
\t\t\t\t\ttile_color = reusable_colors[mode_int]
\t\t\t\telse:
\t\t\t\t\ttile_color = get_tile_color(tile, mode_int)

\t\t\t\tmode_images[mode_index].set_pixel(
\t\t\t\t\tx,
\t\t\t\t\ty,
\t\t\t\t\ttile_color
\t\t\t\t)

\tvar textures: Dictionary = {}

\tfor mode_index in range(all_modes.size()):
\t\tvar mode_texture := ImageTexture.create_from_image(
\t\t\tmode_images[mode_index]
\t\t)

\t\tif mode_texture == null:
\t\t\treturn {}

\t\ttextures[all_modes[mode_index]] = mode_texture

\treturn textures


'''
          cache = replace_regex_once(
              cache,
              r"func _build_atomic_texture_atlas\(.*?\n\n(?=static func create_mode_textures_from_rgba8)",
              independent_builder,
              "MapTextureCache independent builder",
          )

          prepared_installers = '''static func create_mode_textures_from_rgba8(
\tatlas_data: PackedByteArray,
\tmap_width: int,
\tmap_height: int,
\tmodes: Array[int]
) -> Dictionary:
\tif map_width <= 0 or map_height <= 0 or modes.is_empty():
\t\treturn {}

\tvar expected_size := map_width * modes.size() * map_height * 4

\tif atlas_data.size() != expected_size:
\t\tpush_error(
\t\t\t"Map atlas byte size mismatch. Expected "
\t\t\t+ str(expected_size)
\t\t\t+ ", received "
\t\t\t+ str(atlas_data.size())
\t\t\t+ "."
\t\t)
\t\treturn {}

\tvar atlas_image := Image.create_from_data(
\t\tmap_width * modes.size(),
\t\tmap_height,
\t\tfalse,
\t\tImage.FORMAT_RGBA8,
\t\tatlas_data
\t)
\treturn create_mode_textures_from_atlas_image(
\t\tatlas_image,
\t\tmap_width,
\t\tmap_height,
\t\tmodes
\t)


static func create_mode_textures_from_atlas_image(
\tatlas_image: Image,
\tmap_width: int,
\tmap_height: int,
\tmodes: Array[int]
) -> Dictionary:
\tif atlas_image == null:
\t\treturn {}
\tif map_width <= 0 or map_height <= 0 or modes.is_empty():
\t\treturn {}
\tif atlas_image.get_width() != map_width * modes.size():
\t\treturn {}
\tif atlas_image.get_height() != map_height:
\t\treturn {}

\tvar textures: Dictionary = {}

\tfor mode_index in range(modes.size()):
\t\tvar mode_image := atlas_image.get_region(Rect2i(
\t\t\tmode_index * map_width,
\t\t\t0,
\t\t\tmap_width,
\t\t\tmap_height
\t\t))
\t\tvar mode_texture := ImageTexture.create_from_image(mode_image)

\t\tif mode_texture == null:
\t\t\treturn {}

\t\ttextures[modes[mode_index]] = mode_texture

\treturn textures


'''
          cache = replace_regex_once(
              cache,
              r"static func create_mode_textures_from_rgba8\(.*?\n\n(?=func _get_unique_modes)",
              prepared_installers,
              "MapTextureCache prepared texture installers",
          )
          cache = replace_once(
              cache,
              "\t\tif not texture_cache[mode_int] is Texture2D:\n",
              "\t\tif not texture_cache[mode_int] is ImageTexture:\n",
              "MapTextureCache complete set type",
          )
          cached_texture_getter = '''func _get_cached_texture(mode: int) -> ImageTexture:
\tif not mode_textures.has(mode):
\t\treturn null

\tvar raw_texture = mode_textures[mode]

\tif not raw_texture is ImageTexture:
\t\treturn null

\treturn raw_texture as ImageTexture


'''
          cache = replace_regex_once(
              cache,
              r"func _get_cached_texture\(mode: int\) -> Texture2D:.*?\n\n(?=func get_tile_color)",
              cached_texture_getter,
              "MapTextureCache cached texture getter",
          )
          cache_path.write_text(cache, encoding="utf-8")

          state_path = Path("scripts/map/visuals/MapTextureCacheState.gd")
          state = state_path.read_text(encoding="utf-8")
          state = replace_once(
              state,
              "# Owns session-level rendered map texture caches. Every cache is a complete set\n"
              "# of AtlasTexture views into one shared atlas, never a partially warmed set.\n",
              "# Owns session-level rendered map texture caches. Every cache is a complete set\n"
              "# of independent ImageTextures, never a partially prepared or warmed set.\n",
              "MapTextureCacheState header",
          )
          state = replace_once(
              state,
              "\t\tif not texture_cache[mode_int] is Texture2D:\n",
              "\t\tif not texture_cache[mode_int] is ImageTexture:\n",
              "MapTextureCacheState complete set type",
          )
          state_path.write_text(state, encoding="utf-8")

          invariants_path = Path("ci/RENDERING_INVARIANTS.md")
          invariants = invariants_path.read_text(encoding="utf-8")
          invariants = replace_once(
              invariants,
              "- World and city map-mode textures are prepared as one complete, atomic cache.\n"
              "- No map mode may be generated incrementally across gameplay frames.\n"
              "- Switching map modes must be a cached texture swap, not a generation boundary.\n"
              "- A partial cache must never be published or stored.\n",
              "- World and city map modes are prepared as one complete, atomic cache of independent `ImageTexture` resources.\n"
              "- No map mode may be generated incrementally across gameplay frames.\n"
              "- No runtime map mode may remain an `AtlasTexture` view into one wide shared GPU atlas.\n"
              "- Switching map modes must be a cached texture swap, not a generation boundary.\n"
              "- A partial cache must never be published or stored.\n",
              "Rendering invariant map modes",
          )
          invariants = replace_once(
              invariants,
              "- First-city CPU preparation may run while the world remains interactive, but the city is revealed only after its complete map atlas is ready.\n",
              "- First-city CPU preparation may run while the world remains interactive, but the city is revealed only after its complete independent map-texture set is ready.\n",
              "Rendering invariant city preparation",
          )
          invariants_path.write_text(invariants, encoding="utf-8")

          world_test_path = Path("scripts/world/rendering/WorldFoundingFlowTest.gd")
          world_test = world_test_path.read_text(encoding="utf-8")
          world_texture_test = '''\tvar texture_instance_ids: Dictionary = {}

\tfor mode in view_modes:
\t\tvar raw_texture = renderer.world_texture_cache.mode_textures.get(
\t\t\tmode
\t\t)
\t\t_expect(
\t\t\traw_texture is ImageTexture,
\t\t\t"Every world map mode must have a ready independent ImageTexture."
\t\t)

\t\tif not raw_texture is ImageTexture:
\t\t\tcontinue

\t\tvar texture := raw_texture as ImageTexture
\t\tvar texture_instance_id := texture.get_instance_id()
\t\t_expect(
\t\t\tnot texture_instance_ids.has(texture_instance_id),
\t\t\t"Each world map mode must own a distinct GPU texture resource."
\t\t)
\t\ttexture_instance_ids[texture_instance_id] = true
\t\t_expect(
\t\t\ttexture.get_width() == source_world.width
\t\t\tand texture.get_height() == source_world.height,
\t\t\t"Each world map texture must match the source map dimensions."
\t\t)

\t\tif expect_saved_texture_reuse:
\t\t\t_expect(
\t\t\t\tint(expected_world_texture_instance_ids.get(mode, -1))
\t\t\t\t== texture_instance_id,
\t\t\t\t"Locked-world re-entry must reuse each completed map texture."
\t\t\t)
\t\telse:
\t\t\texpected_world_texture_instance_ids[mode] = texture_instance_id

\t\trenderer.set_world_view_mode(mode)
\t\t_expect(
\t\t\trenderer.world_map_texture == texture,
\t\t\t"Switching world map modes must be a cache-only texture lookup."
\t\t)

\t\tvar texture_image := texture.get_image()
\t\tvar sample_tile_position := Vector2i(
\t\t\tint(source_world.width / 2),
\t\t\tint(source_world.height / 2)
\t\t)
\t\tvar source_tile := source_world.get_tile(
\t\t\tsample_tile_position.x,
\t\t\tsample_tile_position.y
\t\t)
\t\tvar expected_color: Color = renderer.get_tile_color_for_mode(
\t\t\tsource_tile,
\t\t\tmode
\t\t)
\t\tvar actual_color := texture_image.get_pixelv(
\t\t\tsample_tile_position
\t\t)
\t\t_expect(
\t\t\t_colors_match_rgba8(actual_color, expected_color),
\t\t\t"Batched world map colors must match the single-mode color contract."
\t\t)

\trenderer.set_world_view_mode(original_view_mode)'''
          world_test = replace_regex_once(
              world_test,
              r"\tvar shared_atlas: Texture2D\n.*?\n\trenderer\.set_world_view_mode\(original_view_mode\)",
              world_texture_test,
              "World independent texture assertions",
          )
          world_test_path.write_text(world_test, encoding="utf-8")

          city_test_path = Path("scripts/city/rendering/CityRendererRefactorSmokeTest.gd")
          city_test = city_test_path.read_text(encoding="utf-8")
          city_texture_test = '''\tvar texture_instance_ids: Dictionary = {}

\tfor mode in view_modes:
\t\tvar raw_texture = renderer.city_texture_cache.mode_textures.get(
\t\t\tmode
\t\t)
\t\t_expect(
\t\t\traw_texture is ImageTexture,
\t\t\t"Every city map mode must have a ready independent ImageTexture."
\t\t)

\t\tif not raw_texture is ImageTexture:
\t\t\tcontinue

\t\tvar texture := raw_texture as ImageTexture
\t\tvar texture_instance_id := texture.get_instance_id()
\t\t_expect(
\t\t\tnot texture_instance_ids.has(texture_instance_id),
\t\t\t"Each city map mode must own a distinct GPU texture resource."
\t\t)
\t\ttexture_instance_ids[texture_instance_id] = true
\t\t_expect(
\t\t\ttexture.get_width() == renderer.city_world.width
\t\t\tand texture.get_height() == renderer.city_world.height,
\t\t\t"Each city map texture must match the source map dimensions."
\t\t)
\t\trenderer.set_city_view_mode(mode)
\t\t_expect(
\t\t\trenderer.city_terrain_texture == texture
\t\t\tand renderer.city_terrain_sprite != null
\t\t\tand renderer.city_terrain_sprite.texture == texture,
\t\t\t"Switching city map modes must only swap the retained texture."
\t\t)

\t\tvar sample_tile_position := Vector2i(
\t\t\tint(renderer.city_world.width / 2),
\t\t\tint(renderer.city_world.height / 2)
\t\t)
\t\tvar source_tile := renderer.city_world.get_tile(
\t\t\tsample_tile_position.x,
\t\t\tsample_tile_position.y
\t\t)
\t\tvar expected_color := renderer.get_city_tile_color_for_mode(
\t\t\tsource_tile,
\t\t\tmode
\t\t)
\t\tvar actual_color := texture.get_image().get_pixelv(
\t\t\tsample_tile_position
\t\t)
\t\t_expect(
\t\t\t_colors_match_rgba8(actual_color, expected_color),
\t\t\t"Batched city map colors must match the single-mode color contract."
\t\t)

\trenderer.set_city_view_mode(original_view_mode)'''
          city_test = replace_regex_once(
              city_test,
              r"\tvar shared_atlas: Texture2D\n.*?\n\trenderer\.set_city_view_mode\(original_view_mode\)",
              city_texture_test,
              "City independent texture assertions",
          )
          city_test_path.write_text(city_test, encoding="utf-8")
          PY

      - name: Verify static architecture
        shell: bash
        run: python3 ci/audit_gdscript.py

      - name: Commit converted texture architecture
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-independent-map-texture-test.yml
          git config user.name "Paladin CI"
          git config user.email "paladin-ci@users.noreply.github.com"
          git add scripts/map/cache/MapTextureCache.gd \
            scripts/map/visuals/MapTextureCacheState.gd \
            scripts/world/rendering/WorldFoundingFlowTest.gd \
            scripts/city/rendering/CityRendererRefactorSmokeTest.gd \
            ci/RENDERING_INVARIANTS.md \
            .github/workflows/apply-independent-map-texture-test.yml
          git commit -m "Test independent map-mode GPU textures"
          git push origin HEAD:test/independent-map-textures
