name: Fix City Construction API Refactor Parser
on:
  push:
    branches:
      - agent/extract-city-construction-api
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[parser-fixed]') && !contains(github.event.head_commit.message, '[construction-api-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix multiline declaration parser
        run: python3 ci/fix_construction_api_refactor_parser.py
      - name: Commit parser fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/refactor_city_construction_api.py
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Fix construction API refactor parser [parser-fixed]"
          git push
