name: Apply road and citizen selection fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/road-hover-citizen-selection'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/road-hover-citizen-selection
          fetch-depth: 0

      - name: Apply verified patch
        run: |
          git apply --check ci/road-selection-fix.patch
          git apply ci/road-selection-fix.patch

      - name: Remove temporary application files
        run: |
          rm -f ci/road-selection-fix.patch
          rm -f .github/workflows/apply-road-selection-fix-temp.yml
          rm -f .github/workflows/export-fix-temp.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix road hover and moving citizen selection"
          git push origin HEAD:fix/road-hover-citizen-selection
