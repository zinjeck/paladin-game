name: Pass 11 Root Test Fix

on:
  push:
    branches:
      - agent/pass11-worlddata-audit

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass11-worlddata-audit
      - name: Update root navigation-state assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path('scripts/city/simulation/CityCitizenSpatialStateIsolationTest.gd'),
              Path('scripts/city/simulation/CityCitizenRegistryStateIsolationTest.gd'),
          ]
          replacements = {
              'city_a_root.object_access_tile_cache': 'city_a_root.navigation_state.object_access_tile_cache',
              'city_b_root.object_access_tile_cache': 'city_b_root.navigation_state.object_access_tile_cache',
              'city_root.object_access_tile_cache': 'city_root.navigation_state.object_access_tile_cache',
          }
          for path in paths:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/city/simulation/CityCitizenSpatialStateIsolationTest.gd scripts/city/simulation/CityCitizenRegistryStateIsolationTest.gd
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Pass 11: align root isolation assertions with navigation state"
          git push origin HEAD:agent/pass11-worlddata-audit
