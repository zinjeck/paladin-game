name: Logistics API Inventory

on:
  push:
    branches:
      - agent/extract-city-logistics-api

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory logistics functions and callers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          world_path = root / 'scripts/world/simulation/WorldData.gd'
          text = world_path.read_text(encoding='utf-8')
          lines = text.splitlines()

          func_re = re.compile(r'^(?:static\s+)?func\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(')
          starts = []
          for i, line in enumerate(lines):
              m = func_re.match(line)
              if m:
                  starts.append((i, m.group(1)))

          logistics_terms = ('ground_pile', 'haul_reservation', 'haul_endpoint')
          print('=== Candidate WorldData logistics functions ===')
          candidates = []
          for pos, (start, name) in enumerate(starts):
              end = starts[pos + 1][0] if pos + 1 < len(starts) else len(lines)
              body = '\n'.join(lines[start:end])
              if any(term in name for term in logistics_terms):
                  candidates.append(name)
                  calls = sorted(set(re.findall(r'\b([A-Za-z_][A-Za-z0-9_]*)\s*\(', '\n'.join(lines[start+1:end]))))
                  direct_state = sorted(set(re.findall(r'\b(city_(?:ground_pile|haul_reservation)[A-Za-z0-9_]*|next_city_(?:ground_pile|haul_reservation)[A-Za-z0-9_]*)\b', body)))
                  print(f'FUNCTION {name} lines {start+1}-{end}')
                  if direct_state:
                      print('  state:', ', '.join(direct_state))
                  if calls:
                      print('  calls:', ', '.join(calls))

          print('\n=== External WorldData logistics references ===')
          reference_re = re.compile(r'WorldData\.([A-Za-z_][A-Za-z0-9_]*(?:ground_pile|haul_reservation|haul_endpoint)[A-Za-z0-9_]*)')
          for path in sorted((root / 'scripts').rglob('*.gd')):
              if path == world_path:
                  continue
              ptext = path.read_text(encoding='utf-8')
              refs = sorted(set(reference_re.findall(ptext)))
              if refs:
                  print(path)
                  for ref in refs:
                      print('  ' + ref)

          print('\n=== Candidate function callers inside WorldData ===')
          for name in candidates:
              count = len(re.findall(rf'\b{re.escape(name)}\s*\(', text)) - 1
              if count:
                  print(f'{name}: {count}')
          PY
