name: Pass 13 Final Audit Fix
on:
  push:
    branches: [agent/pass13-remove-legacy-city-backend]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass13-remove-legacy-city-backend
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ci/audit_gdscript.py')
          t=p.read_text(encoding='utf-8')
          t=t.replace('''            political_state_text.count(\n                "CityCitizenMovementRuntimeStateScript.new()"\n            )\n            < 3\n''','''            political_state_text.count(\n                "CityCitizenMovementRuntimeStateScript.new()"\n            )\n            < 2\n''')
          t=t.replace('''                "movement-runtime fallback must be created initially, on "\n                "reset, and after legacy adoption"\n''','''                "movement-runtime fallback must be created initially and on reset"\n''')
          p.write_text(t,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/audit_gdscript.py
          git commit -m "Pass 13: finalize post-legacy audit invariant"
          git push origin HEAD:agent/pass13-remove-legacy-city-backend
