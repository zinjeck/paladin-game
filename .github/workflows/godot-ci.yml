name: Godot CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: godot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Godot 4.7.1 headless tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Paladin
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply checked task-runtime parser repair
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref == 'refactor/citizen-systems-explicit-state-only-redo'
        shell: bash
        run: |
          set -euo pipefail
          git switch -C "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/citizens/simulation/systems/CityCitizenTaskRuntimeSystem.gd")
          text = path.read_text(encoding="utf-8")
          old = '''\t\t\tif raw_current_haul is Dictionary:
          \t\t\t\tcitizen["current_haul"] = (
          \t\t\t\t\tCityCitizens.make_city_citizen_haul(
          \t\t\t\t\t\traw_current_haul
          \t\t\t\t\t)
          \t\t\telse:
          '''
          new = '''\t\t\tif raw_current_haul is Dictionary:
          \t\t\t\tcitizen["current_haul"] = (
          \t\t\t\t\tCityCitizens.make_city_citizen_haul(
          \t\t\t\t\t\traw_current_haul
          \t\t\t\t\t)
          \t\t\t\t)
          \t\t\telse:
          '''
          count = text.count(old)
          if count == 0 and text.count(new) == 1:
              print("Task-runtime parser repair is already applied.")
          elif count == 1:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          else:
              raise RuntimeError(
                  f"Expected exactly one damaged task-runtime snippet, found {count}"
              )
          PY
          if git diff --quiet; then
            echo "Task-runtime parser repair is already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/citizens/simulation/systems/CityCitizenTaskRuntimeSystem.gd
            git commit -m "fix: restore citizen task runtime parser delimiter"
            git push origin "HEAD:$GITHUB_HEAD_REF"
            echo "Pushed the checked parser repair to the canonical PR branch."
            exit 1
          fi

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/godot-4.7.1
          key: godot-4.7.1-linux-x86-64

      - name: Install Godot 4.7.1
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          GODOT_DIR="${RUNNER_TOOL_CACHE}/godot-4.7.1"
          mkdir -p "$GODOT_DIR"
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$GODOT_DIR"
          mv "$GODOT_DIR/Godot_v4.7.1-stable_linux.x86_64" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"

      - name: Put Godot on PATH
        shell: bash
        run: |
          echo "${RUNNER_TOOL_CACHE}/godot-4.7.1" >> "$GITHUB_PATH"

      - name: Show Godot version
        run: godot --version

      - name: Guard settlement-local authority boundaries
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python3 ci/settlement_locality_guard.py 2>&1 | tee ci-logs/settlement-locality-guard.log

      - name: Audit GDScript structure and resource paths
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python3 ci/audit_gdscript.py 2>&1 | tee ci-logs/static-audit.log

      - name: Import project resources
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          timeout 300s godot --headless --path . --import 2>&1 | tee ci-logs/import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|Failed to create an autoload" ci-logs/import.log; then
            echo "Godot import reported script compilation errors."
            exit 1
          fi

      - name: Run Paladin tests
        shell: bash
        run: bash ci/run_godot_tests.sh

      - name: Upload Godot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-ci-logs
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14
