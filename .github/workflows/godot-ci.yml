name: Apply independent texture conversion

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'test/independent-map-textures'
    runs-on: ubuntu-latest
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Execute one-time conversion script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYRUN'
          from pathlib import Path

          workflow_path = Path('.github/workflows/apply-independent-map-texture-test.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          if marker not in workflow or end_marker not in workflow:
              raise RuntimeError('Could not locate embedded conversion script.')
          script = workflow.split(marker, 1)[1].split(end_marker, 1)[0]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in script.splitlines()
          )
          exec(compile(script, str(workflow_path), 'exec'), {'__name__': '__main__'})
          PYRUN

      - name: Verify static architecture
        shell: bash
        run: python3 ci/audit_gdscript.py

      - name: Restore normal CI and commit conversion
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/godot-ci.yml > .github/workflows/godot-ci.yml
          rm .github/workflows/apply-independent-map-texture-test.yml
          git config user.name "Paladin CI"
          git config user.email "paladin-ci@users.noreply.github.com"
          git add .
          git commit -m "Test independent map-mode GPU textures"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
