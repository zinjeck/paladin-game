name: Godot CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: godot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Apply pass and run Godot tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Paladin feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply asserted topology safety transformations
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/repair_topology_transformer.py
          python3 ci/apply_topology_safety_pass.py
          python3 ci/audit_gdscript.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/godot-ci.yml \
            scripts/world/simulation/WorldData.gd \
            scripts/city/simulation/systems/CityConstructionSystem.gd \
            scripts/citizens/simulation/systems/CitizenMovementSystem.gd \
            scripts/city/simulation/CityTopologySafetyTest.gd \
            scripts/city/simulation/CityTopologySafetyTest.tscn
          git commit -m "Make construction finalization topology-safe"
          git push origin HEAD:${{ github.head_ref }}

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/godot-4.7.1
          key: godot-4.7.1-linux-x86-64

      - name: Install Godot 4.7.1
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          GODOT_DIR="${RUNNER_TOOL_CACHE}/godot-4.7.1"
          mkdir -p "$GODOT_DIR"
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$GODOT_DIR"
          mv "$GODOT_DIR/Godot_v4.7.1-stable_linux.x86_64" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"

      - name: Put Godot on PATH
        shell: bash
        run: |
          echo "${RUNNER_TOOL_CACHE}/godot-4.7.1" >> "$GITHUB_PATH"

      - name: Show Godot version
        run: godot --version

      - name: Audit GDScript structure and resource paths
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python3 ci/audit_gdscript.py 2>&1 | tee ci-logs/static-audit.log

      - name: Import project resources
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          timeout 300s godot --headless --path . --import 2>&1 | tee ci-logs/import.log

      - name: Run Paladin tests
        shell: bash
        run: bash ci/run_godot_tests.sh

      - name: Upload Godot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-ci-logs
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14
