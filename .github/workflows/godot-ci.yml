name: Godot CI

on:
  push:
    branches:
      - main
      - "ci/**"
      - "paladin/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Godot 4.4.1 headless tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Paladin
        uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/godot-4.4.1
          key: godot-4.4.1-linux-x86-64

      - name: Install Godot 4.4.1
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          GODOT_DIR="${RUNNER_TOOL_CACHE}/godot-4.4.1"
          mkdir -p "$GODOT_DIR"
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$GODOT_DIR"
          mv "$GODOT_DIR/Godot_v4.4.1-stable_linux.x86_64" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"

      - name: Put Godot on PATH
        shell: bash
        run: |
          echo "${RUNNER_TOOL_CACHE}/godot-4.4.1" >> "$GITHUB_PATH"

      - name: Show Godot version
        run: godot --version

      - name: Import project resources
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          timeout 300s godot --headless --path . --import 2>&1 | tee ci-logs/import.log

      - name: Run Paladin tests
        shell: bash
        run: bash ci/run_godot_tests.sh

      - name: Upload Godot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-ci-logs
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14
