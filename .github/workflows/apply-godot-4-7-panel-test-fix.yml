name: Apply Godot 4.7 panel test stabilization

on:
  push:
    branches:
      - migration/godot-4.7.1-panel-test-fix

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.head_commit.message != 'Stabilize construction panel zoom test on Godot 4.7'
    runs-on: ubuntu-latest

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: migration/godot-4.7.1-panel-test-fix
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stabilize construction panel zoom test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/city/rendering/CityRendererRefactorSmokeTest.gd')
          text = path.read_text(encoding='utf-8')

          old_call = '\t_test_universal_construction_core(renderer)'
          new_call = '\tawait _test_universal_construction_core(renderer)'
          if text.count(old_call) != 1:
              raise SystemExit(f'Expected exactly one construction-core call, found {text.count(old_call)}.')
          text = text.replace(old_call, new_call, 1)

          old_block = '''\tvar panel_size_before_zoom := (
\t\trenderer.construction_site_info_panel.size
\t)
\tvar original_camera_zoom := renderer.camera.zoom
\trenderer.camera.zoom = original_camera_zoom * 1.5
\trenderer.update_construction_site_info_panel_screen_position()
\t_expect(
\t\trenderer.construction_site_info_panel.size
\t\t== panel_size_before_zoom,
\t\t"Construction panel dimensions must remain screen-constant under zoom."
\t)
\trenderer.camera.zoom = original_camera_zoom
\trenderer.update_construction_site_info_panel_screen_position()
'''

          new_block = '''\t# Godot 4.7 resolves Control minimum-size changes at the frame boundary.
\t# Let the newly populated labels settle before establishing the baseline,
\t# then verify the invariant after a real zoomed frame rather than within the
\t# same call stack that changed the panel text.
\tawait get_tree().process_frame
\tvar panel_size_before_zoom := (
\t\trenderer.construction_site_info_panel.size
\t)
\tvar original_camera_zoom := renderer.camera.zoom
\trenderer.camera.zoom = original_camera_zoom * 1.5
\trenderer.update_construction_site_info_panel_screen_position()
\tawait get_tree().process_frame
\tvar panel_size_after_zoom := (
\t\trenderer.construction_site_info_panel.size
\t)
\t_expect(
\t\tpanel_size_before_zoom.is_equal_approx(panel_size_after_zoom),
\t\t"Construction panel dimensions must remain screen-constant under zoom."
\t)
\trenderer.camera.zoom = original_camera_zoom
\trenderer.update_construction_site_info_panel_screen_position()
\tawait get_tree().process_frame
'''

          if text.count(old_block) != 1:
              raise SystemExit(f'Expected exactly one panel zoom assertion block, found {text.count(old_block)}.')
          text = text.replace(old_block, new_block, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit test stabilization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/city/rendering/CityRendererRefactorSmokeTest.gd
          git commit -m "Stabilize construction panel zoom test on Godot 4.7"
          git push origin HEAD:migration/godot-4.7.1-panel-test-fix
