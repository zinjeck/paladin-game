name: Apply atomic render cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'paladin/intensive-debug-performance-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: paladin/intensive-debug-performance-cleanup
          fetch-depth: 0

      - name: Apply verified cleanup
        run: python3 ci/apply_atomic_render_cleanup.py

      - name: Remove temporary application files
        shell: bash
        run: |
          rm -f \
            .github/workflows/apply-atomic-render-cleanup.yml \
            ci/apply_atomic_render_cleanup.py
          rm -rf ci/atomic_render_cleanup_payload

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "paladin-ci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make map modes atomic and audit redraws"
          git push origin HEAD:paladin/intensive-debug-performance-cleanup
